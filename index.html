<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ののコン スタートアップ チェックリスト</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --line:#e3e6ea; --ink:#1c2430; --sub:#6b7686;
    --head:#1f2937; --accent:#e8744f; --accent-soft:#fdeee8; --done:#0e9f6e; --done-soft:#eafaf2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
  header{background:var(--head);color:#fff;padding:16px 20px 0}
  header .wrap{max-width:860px;margin:0 auto}
  header h1{font-size:17px;font-weight:700}
  header .sub{font-size:12px;color:#cdd5e0;margin:3px 0 14px}
  /* mode toggle */
  .mode{display:inline-flex;background:#0e1620;border-radius:999px;padding:3px;gap:2px;margin-bottom:14px}
  .mode button{background:none;border:none;color:#9aa6b4;font-size:12.5px;font-weight:700;
    padding:7px 16px;border-radius:999px;cursor:pointer}
  .mode button.on{background:var(--accent);color:#fff}
  /* tabs */
  .tabs{display:flex;gap:2px;flex-wrap:wrap}
  .tab{padding:10px 18px;color:#aab4c2;cursor:pointer;border:none;background:none;font-size:13px;
    border-bottom:3px solid transparent;font-weight:600}
  .tab.on{color:#fff;border-bottom-color:var(--accent)}
  .tab .c{opacity:.7;font-size:11px;margin-left:5px}
  /* 名前選択バー */
  .ident{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 12px;
    color:#e6ebf1;font-size:13px}
  .ident select{padding:7px 10px;border-radius:8px;border:1px solid #3a4653;background:#0e1620;
    color:#fff;font-size:13px;min-width:200px}
  .ident .who{font-weight:700;color:#fff}
  .ident button{background:none;border:1px solid #3a4653;color:#cdd5e0;font-size:12px;
    padding:5px 11px;border-radius:999px;cursor:pointer}
  .ident button:hover{border-color:var(--accent);color:var(--accent)}
  .ident .warn{background:#3a2a1e;color:#f0c9b3;padding:4px 10px;border-radius:8px;font-size:12px}

  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
  .modeNote{font-size:12.5px;color:var(--sub);background:var(--accent-soft);
    border-radius:8px;padding:8px 12px;margin-bottom:16px}

  .progress-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 18px;margin-bottom:22px;display:flex;align-items:center;gap:16px}
  .ring{position:relative;width:54px;height:54px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .pmeta{flex:1}
  .pmeta .big{font-size:14px;font-weight:700}
  .pmeta .small{font-size:12px;color:var(--sub)}

  .group{margin-bottom:18px}
  .group .gh{font-size:12px;font-weight:700;color:var(--sub);text-transform:none;
    margin-bottom:7px;display:flex;align-items:center;gap:7px}
  .group .gh .gc{margin-left:auto;font-weight:400;font-size:11px}
  ul{list-style:none}
  li.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:11px 14px;margin-bottom:7px;display:flex;gap:12px;align-items:flex-start;
    cursor:pointer;transition:.15s}
  li.item:hover{border-color:#cfd5dc}
  .check{width:20px;height:20px;border:2px solid #cdd3da;border-radius:6px;flex:none;margin-top:1px;
    display:flex;align-items:center;justify-content:center;transition:.15s}
  .check svg{width:12px;height:12px;opacity:0;transition:.15s}
  li.done .check{background:var(--done);border-color:var(--done)}
  li.done .check svg{opacity:1}
  li.done{background:var(--done-soft);border-color:#cdeede}
  li.done .title{color:var(--sub);text-decoration:line-through}
  .title{font-size:14px;font-weight:600}
  .note{font-size:12px;color:var(--sub);margin-top:1px}
  .tag{display:inline-block;font-size:10.5px;padding:1px 8px;border-radius:999px;margin-top:5px}
  .tag.watch{background:#eef1f5;color:#7a8696}
  .tag.do{background:#fff0e8;color:#c5663c}
  .ilink{flex:none;align-self:center;font-size:12px;font-weight:700;color:var(--accent);
    text-decoration:none;padding:6px 12px;border:1px solid #f3d5c7;border-radius:999px;white-space:nowrap}
  .ilink:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* 管理タブ */
  .metrics{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .metric{flex:1;min-width:130px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
  .metric .k{font-size:11.5px;color:var(--sub)}
  .metric .v{font-size:20px;font-weight:700;margin-top:2px}
  .apanel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}
  .apanel table{border-collapse:collapse;width:100%;font-size:13px}
  .apanel th,.apanel td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  .apanel th{background:#eef1f5;color:var(--sub);font-weight:600;font-size:11.5px;position:sticky;top:0}
  .apanel tbody tr{cursor:pointer}
  .apanel tbody tr:hover{background:#fafcff}
  .apanel tbody tr.sel{background:var(--accent-soft)}
  .apanel .pname{font-weight:700}
  /* 名前列を左固定（横スクロールしても見える） */
  .apanel th:first-child{position:sticky;left:0;z-index:3;background:#eef1f5;
    border-right:1px solid var(--line)}
  .apanel td:first-child{position:sticky;left:0;z-index:1;background:#fff;
    border-right:1px solid var(--line)}
  .apanel tbody tr:hover td:first-child{background:#fafcff}
  .apanel tbody tr.sel td:first-child{background:var(--accent-soft)}
  .abar{width:100px;height:8px;background:#eef1f5;border-radius:99px;overflow:hidden;display:inline-block;
    vertical-align:middle;margin-right:8px}
  .abar > i{display:block;height:100%;background:var(--accent)}
  .apct{font-size:12px;color:var(--sub)}
  .badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
  .badge.ok{background:var(--done-soft);color:var(--done)}
  .badge.warn{background:#fef3e2;color:#d97706}
  .badge.bad{background:#fdecec;color:#dc2626}
  .adetail{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
  .adetail h3{font-size:14.5px;margin-bottom:12px}
  .dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
  .dcol .chh{font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:7px;display:flex;gap:8px}
  .dcol .chh .cnt{margin-left:auto;font-weight:400}
  .dstep{font-size:12.5px;padding:2px 0}
  .dstep.off{color:#a5adb8}
  .ahint{color:var(--sub);font-size:12px;margin:12px 0}
  .abtn{background:#fff;border:1px solid var(--line);color:var(--sub);font-size:12px;
    padding:6px 14px;border-radius:999px;cursor:pointer;margin-bottom:14px}
  .abtn:hover{border-color:var(--accent);color:var(--accent)}

  .mpanel tbody tr{cursor:default}
  .mpanel tr.male td{background:#eaf4fd}
  .mpanel tr.female td{background:#fdeef3}
  .mpanel tr.male td:first-child{background:#eaf4fd}
  .mpanel tr.female td:first-child{background:#fdeef3}
  /* メンバー情報カード */
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .mcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;
    display:flex;flex-direction:column;gap:10px}
  .mtop{display:flex;gap:12px;align-items:center}
  .mava{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#fff;font-size:16px;background:var(--accent)}
  .mname{font-size:15px;font-weight:700;line-height:1.2}
  .mkana{font-size:11px;color:var(--sub)}
  .mrows{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
  .mrow{display:flex;gap:8px}
  .mrow .k{color:var(--sub);width:76px;flex:none}
  .mrow .v{color:var(--ink);font-weight:500}
</style>
</head>

/* ---------- 状態 ---------- */
let chap=0;
let me = JSON.parse(localStorage.getItem("nonocon_me")||"null"); // {sid,name}
let state = {}; // {stepId:true}
let ROSTER = []; // メンバー情報（名簿）

/* 受講生用の合言葉（正誤はサーバー側で照合。HTMLには書かれていない） */
const PASS_KEY = "nonocon_pass";
let PASS = localStorage.getItem(PASS_KEY) || "";

/* ---------- 管理モード（のの専用）----------
   受講生には管理タブは一切表示されない。
   checklist.html#admin で開いてキーを入力すると、このブラウザにだけ「📊 管理」タブが出る。
   キーの正誤はサーバー側(action=all)で検証されるので、ページを覗いてもデータは取れない。 */
let ADMIN_KEY = localStorage.getItem("nonocon_admin_key") || "";
let adminCache = null, adminSel = null;
if(location.hash === "#admin" && !ADMIN_KEY){
  const k = prompt("管理キーを入力してください");
  if(k && k.trim()){ ADMIN_KEY = k.trim(); localStorage.setItem("nonocon_admin_key", ADMIN_KEY); }
}
const cacheKey = ()=> "nonocon_progress_"+(me?me.sid:"local");
const loadCache = ()=>{ state = JSON.parse(localStorage.getItem(cacheKey())||"{}"); };
const saveCache = ()=>{ localStorage.setItem(cacheKey(), JSON.stringify(state)); };

/* ---------- スプシ通信（JSONPでCORS回避） ---------- */
function jsonp(params){
  return new Promise((resolve,reject)=>{
    if(!API_URL){ reject("no-api"); return; }
    const cb = "cb_"+Date.now()+"_"+Math.floor(Math.random()*1e6);
    const s = document.createElement("script");
    const cleanup = ()=>{ delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s); };
    window[cb] = (data)=>{ resolve(data); cleanup(); };
    s.onerror = ()=>{ reject("net"); cleanup(); };
    const q = Object.entries(Object.assign({pass:PASS},params,{callback:cb}))
      .map(([k,v])=>encodeURIComponent(k)+"="+encodeURIComponent(v)).join("&");
    s.src = API_URL+"?"+q;
    document.body.appendChild(s);
  });
}

/* 入会年度＋入会年月の合体表記（例：ののコン2024（2025年1月））。「23年9月」→「2023年9月」に補完 */
function fmtCohortJoin(m){
  const jm = String(m.join||"").match(/^(\d{2})年(\d{1,2})月/);
  const jf = jm ? `20${jm[1]}年${jm[2]}月` : String(m.join||"").replace(/-$/,"");
  if(m.cohort && jf) return `${m.cohort}（${jf}）`;
  return m.cohort || jf || "—";
}

/* ---------- 名簿の読み込み ---------- */
async function loadRoster(){
  if(ROSTER.length) return ROSTER;
  const r = await jsonp({action:"roster"});
  if(r && r.error) throw r.error;
  ROSTER = r.students||[];
  return ROSTER;
}

/* ---------- 合言葉ゲート ---------- */
function showPassGate(el){
  el.innerHTML = '🔑 合言葉を入力してください：' +
    '<input id="pw" type="password" placeholder="合言葉" style="padding:7px 10px;border-radius:8px;border:1px solid #3a4653;background:#0e1620;color:#fff;font-size:13px">' +
    '<button id="pwgo">OK</button>' +
    '<span id="pwerr" class="warn" style="display:none">合言葉が違います</span>';
  const go = async ()=>{
    const v = document.getElementById("pw").value.trim();
    if(!v) return;
    PASS = v;
    const btn = document.getElementById("pwgo");
    btn.disabled = true;
    btn.textContent = "確認中…";
    document.getElementById("pwerr").style.display = "none";
    try{
      const r = await jsonp({action:"roster"});
      if(r && r.error) throw r.error;
      ROSTER = r.students||[];
      localStorage.setItem(PASS_KEY, PASS);
      initIdent();
    }catch(e){
      PASS = "";
      btn.disabled = false;
      btn.textContent = "OK";
      document.getElementById("pwerr").style.display = "";
    }
  };
  document.getElementById("pwgo").onclick = go;
  document.getElementById("pw").addEventListener("keydown", ev=>{ if(ev.key==="Enter") go(); });
  document.getElementById("pw").focus();
}

/* ---------- 名前選択バー ---------- */
async function initIdent(){
  const el = document.getElementById("ident");
  if(!API_URL){
    el.innerHTML = '<span class="warn">デモモード：保存はこの端末だけ（URL未設定）</span>';
    loadCache(); render(); return;
  }
  if(!PASS){ showPassGate(el); return; }
  if(me){
    el.innerHTML = `<span class="who">👤 ${me.name} さん</span><button id="switch">別の人に切り替え</button>`;
    document.getElementById("switch").onclick=()=>{ localStorage.removeItem("nonocon_me"); me=null; initIdent(); };
    loadProgress();
    loadRoster().then(()=>render()).catch(()=>{}); // メンバー情報用に裏で名簿取得
    return;
  }
  el.innerHTML = 'お名前を選んでください：<select id="who"><option>読み込み中…</option></select>';
  try{
    await loadRoster();
    const sel = document.getElementById("who");
    sel.innerHTML = '<option value="">— 選択 —</option>' +
      ROSTER.map(s=>`<option value="${s.sid}" data-name="${s.name}">${s.name}</option>`).join("");
    sel.onchange=()=>{
      const o=sel.selectedOptions[0]; if(!o.value) return;
      me={sid:o.value, name:o.dataset.name};
      localStorage.setItem("nonocon_me", JSON.stringify(me));
      initIdent();
    };
  }catch(e){
    if(String(e).indexOf("unauthorized") >= 0){
      localStorage.removeItem(PASS_KEY); PASS = "";
      showPassGate(el); return;
    }
    el.innerHTML = '<span class="warn">名簿の読み込みに失敗。通信環境を確認してください。</span>';
    loadCache(); render();
  }
}

async function loadProgress(){
  loadCache(); render();                 // まずキャッシュを即表示
  if(API_URL && me){
    try{ const r = await jsonp({action:"progress", uid:me.sid}); if(r && !r.error){ state = r.checked||{}; saveCache(); render(); } }
    catch(e){ /* オフライン時はキャッシュのまま */ }
  }
}

function toggle(item){
  state[item.id] = !state[item.id];
  saveCache(); render();
  if(API_URL && me){
    jsonp({action:"save", uid:me.sid, name:me.name, step:item.id, label:item.t, checked:state[item.id]?1:0})
      .catch(()=>{});
  }
}

/* ---------- 描画 ---------- */
function chapStats(ci){
  let t=0,d=0;
  DATA[ci].groups.forEach(g=>g.items.forEach(it=>{t++; if(state[it.id])d++;}));
  return {t,d};
}
const MEMBERS = DATA.length;   // メンバー情報タブのインデックス
const ADMIN   = DATA.length+1; // 管理タブのインデックス（キー保持者のみ表示）

/* 章の表示制御：WS期生（1期生〜）は入会年度に「FS」が付く人だけ卸・メーカーを表示 */
function chapterHidden(ci){
  if(DATA[ci].ch !== "実践（卸・メーカー）") return false;
  if(!me) return false;
  const m = ROSTER.find(s=>s.sid===me.sid);
  if(!m || !m.cohort) return false;
  if(m.cohort.indexOf("WS") === 0 && m.cohort.indexOf("FS") < 0) return true;
  return false;
}

function renderTabs(){
  const el=document.getElementById("tabs"); el.innerHTML="";
  DATA.forEach((c,ci)=>{
    if(chapterHidden(ci)) return;
    const {t,d}=chapStats(ci);
    const b=document.createElement("button");
    b.className="tab"+(ci===chap?" on":"");
    b.innerHTML=`${c.ch}<span class="c">${d}/${t}</span>`;
    b.onclick=()=>{chap=ci;render();};
    el.appendChild(b);
  });
  const mb=document.createElement("button");
  mb.className="tab"+(chap===MEMBERS?" on":"");
  mb.innerHTML=`メンバー情報${ROSTER.length?`<span class="c">${ROSTER.length}名</span>`:""}`;
  mb.onclick=()=>{chap=MEMBERS;render();};
  el.appendChild(mb);
  if(ADMIN_KEY){
    const ab=document.createElement("button");
    ab.className="tab"+(chap===ADMIN?" on":"");
    ab.innerHTML=`📊 管理`;
    ab.onclick=()=>{chap=ADMIN;render();};
    el.appendChild(ab);
  }
}

/* ---------- 管理ビュー（全員の進捗一覧）---------- */
const A_CHAPTERS = DATA.map(c=>({ch:c.ch, steps:c.groups.flatMap(g=>g.items.map(it=>[it.id,it.t]))}));
const A_TOTAL = A_CHAPTERS.reduce((a,c)=>a+c.steps.length,0);

async function renderAdmin(){
  const body=document.getElementById("body");
  if(!adminCache){
    body.innerHTML='<div style="text-align:center;color:#6b7686;padding:40px">全員の進捗を読み込み中…</div>';
    let d;
    try{ d = await jsonp({action:"all", key:ADMIN_KEY}); }
    catch(e){ body.innerHTML='<div style="text-align:center;color:#6b7686;padding:40px">通信エラー</div>'; return; }
    if(d.error){
      localStorage.removeItem("nonocon_admin_key"); ADMIN_KEY=""; adminCache=null;
      alert("管理キーが無効です"); chap=0; render(); return;
    }
    adminCache = d;
    if(chap!==ADMIN) return; // 読み込み中に他タブへ移動した場合
  }
  const roster = (adminCache.roster||[]).filter(st=>!st.grad && st.name.replace(/[\s　]+/g,"")!=="野々脇雅史"); // 卒業（在籍）と、のの本人は管理対象外
  const prog={}, last={};
  (adminCache.rows||[]).forEach(r=>{
    if(!prog[r.uid]) prog[r.uid]={};
    prog[r.uid][r.step]=r.checked;
    if(r.checked && r.updated){
      const t=new Date(r.updated);
      if(!last[r.uid] || t>last[r.uid]) last[r.uid]=t;
    }
  });
  const now=new Date();
  const isStd = st => st.cohort && st.cohort.indexOf("WS")===0 && st.cohort.indexOf("FS")<0;
  const rows = roster.map(s=>{
    const p=prog[s.sid]||{};
    const std=isStd(s);
    const per=A_CHAPTERS.map(c=>{
      if(std && c.ch==="実践（卸・メーカー）") return null; // STは対象外
      return {done:c.steps.filter(([id])=>p[id]).length, total:c.steps.length};
    });
    const done=per.reduce((a,x)=>a+(x?x.done:0),0);
    const total=per.reduce((a,x)=>a+(x?x.total:0),0);
    const lu=last[s.sid];
    const days=lu?Math.floor((now-lu)/86400000):null;
    return {s,p,per,done,pct:total?Math.round(done/total*100):0,lu,days};
  }).sort((a,b)=>b.pct-a.pct);

  const avg=rows.length?Math.round(rows.reduce((a,r)=>a+r.pct,0)/rows.length):0;
  const notStarted=rows.filter(r=>r.done===0).length;
  const stalled=rows.filter(r=>r.done>0&&r.days!==null&&r.days>=7).length;

  let html=`<button class="abtn" id="areload">🔄 最新に更新</button>
    <div class="metrics">
      <div class="metric"><div class="k">受講生</div><div class="v">${rows.length}名</div></div>
      <div class="metric"><div class="k">平均進捗</div><div class="v">${avg}%</div></div>
      <div class="metric"><div class="k">未着手</div><div class="v">${notStarted}名</div></div>
      <div class="metric"><div class="k">7日以上停滞</div><div class="v">${stalled}名</div></div>
    </div>
    <div class="apanel"><table>
      <thead><tr><th>受講生</th><th>入会</th>${A_CHAPTERS.map(c=>`<th>${c.ch}</th>`).join("")}
      <th>進捗</th><th>最終更新</th><th>状態</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    const badge = r.done===0 ? '<span class="badge bad">未着手</span>'
      : (r.days>=7 ? `<span class="badge warn">⚠️ ${r.days}日停滞</span>`
      : (r.pct===100 ? '<span class="badge ok">完了 🎉</span>' : '<span class="badge ok">進行中</span>'));
    html+=`<tr data-uid="${r.s.sid}" class="${adminSel===r.s.sid?'sel':''}">
      <td class="pname">${r.s.name.replace(/^-/,"")}</td>
      <td>${fmtCohortJoin(r.s)}</td>
      ${r.per.map(x=>x?`<td>${x.done}/${x.total}</td>`:`<td style="color:#c2c8d0">—</td>`).join("")}
      <td><span class="abar"><i style="width:${r.pct}%"></i></span><span class="apct">${r.pct}%</span></td>
      <td>${r.lu?`${r.lu.getMonth()+1}/${r.lu.getDate()}`:"—"}</td>
      <td>${badge}</td></tr>`;
  });
  html+=`</tbody></table></div>
    <div class="ahint">行をクリックすると、その受講生のステップ詳細が下に表示されます</div>
    <div id="adetail"></div>`;
  body.innerHTML=html;

  document.getElementById("areload").onclick=()=>{adminCache=null;renderAdmin();};
  body.querySelectorAll("tbody tr").forEach(tr=>{
    tr.onclick=()=>{adminSel=tr.dataset.uid;renderAdmin();};
  });
  if(adminSel){
    const r=rows.find(x=>x.s.sid===adminSel);
    if(r){
      document.getElementById("adetail").innerHTML=`<div class="adetail">
        <h3>👤 ${r.s.name.replace(/^-/,"")} さんの詳細</h3>
        <div class="dgrid">${A_CHAPTERS.filter(c=>!(isStd(r.s)&&c.ch==="実践（卸・メーカー）")).map(c=>{
          const done=c.steps.filter(([id])=>r.p[id]).length;
          return `<div class="dcol">
            <div class="chh">${c.ch}<span class="cnt">${done}/${c.steps.length}</span></div>
            ${c.steps.map(([id,label])=>`<div class="dstep ${r.p[id]?'':'off'}">${r.p[id]?'✅':'⬜'} ${label}</div>`).join("")}
          </div>`;
        }).join("")}</div></div>`;
    }
  }
}

function renderMembers(){
  const body=document.getElementById("body"); body.innerHTML="";
  if(!ROSTER.length){
    body.innerHTML='<div style="text-align:center;color:#6b7686;padding:40px">メンバー情報を読み込み中…</div>';
    return;
  }
  // 生年月日未記入だと年齢がシート数式で126等になるため、ありえない値は非表示
  const ageOk=a=>{const n=parseInt(a,10);return(!isNaN(n)&&n>=10&&n<=100)?String(n):"";};
  let html='<div class="apanel mpanel"><table><thead><tr>'+
    '<th>名前</th><th>エリア</th><th>年齢</th><th>誕生日</th><th>入会</th><th>専業/副業</th></tr></thead><tbody>';
  const sorted=[...ROSTER].sort((a,b)=>{
    const na=parseInt(a.sid,10), nb=parseInt(b.sid,10);
    if(isNaN(na)&&isNaN(nb))return 0;
    if(isNaN(na))return 1;
    if(isNaN(nb))return -1;
    return na-nb;
  });
  sorted.forEach(m=>{
    const gcls=(m.gender||"").indexOf("男")>=0?"male":((m.gender||"").indexOf("女")>=0?"female":"");
    html+=`<tr class="${gcls}"><td class="pname">${m.name.replace(/^-/,"")}<div class="mkana">${m.kana||""}</div></td>`+
      `<td>${m.area||"—"}</td>`+
      `<td>${ageOk(m.age)||"—"}</td>`+
      `<td>${m.bday||"—"}</td>`+
      `<td>${fmtCohortJoin(m)}</td>`+
      `<td>${m.work||"—"}</td></tr>`;
  });
  html+='</tbody></table></div>';
  body.innerHTML=html;
}

function render(){
  if(chap < DATA.length && chapterHidden(chap)) chap = 0;
  renderTabs();
  const pc=document.querySelector(".progress-card");
  if(chap===MEMBERS){
    pc.style.display="none";
    renderMembers();
    return;
  }
  if(chap===ADMIN){
    pc.style.display="none";
    renderAdmin();
    return;
  }
  pc.style.display="flex";
  const c=DATA[chap];
  const body=document.getElementById("body"); body.innerHTML="";
  c.groups.forEach(g=>{
    const gd=document.createElement("div"); gd.className="group";
    let gt=0,gdone=0; const ul=document.createElement("ul");
    g.items.forEach(it=>{
      gt++; const done=!!state[it.id]; if(done)gdone++;
      const li=document.createElement("li"); li.className="item"+(done?" done":"");
      const dep = it.dep?`<span class="tag do">前提：${it.dep}</span>`:"";
      const link = it.url?`<a class="ilink" href="${it.url}" target="_blank" rel="noopener">開く ↗</a>`:"";
      li.innerHTML=`<div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
        <div style="flex:1"><div class="title">${it.t}</div>${it.n?`<div class="note">${it.n}</div>`:""}${dep}</div>${link}`;
      li.onclick=()=>toggle(it);
      const a=li.querySelector(".ilink");
      if(a) a.onclick=e=>e.stopPropagation(); // リンククリックではチェックを切り替えない
      ul.appendChild(li);
    });
    if(g.g) gd.innerHTML=`<div class="gh">${g.g}<span class="gc">${gdone}/${gt}</span></div>`;
    gd.appendChild(ul); body.appendChild(gd);
  });
  const {t,d}=chapStats(chap);
  const pct=t?Math.round(d/t*100):0;
  document.getElementById("pctText").textContent=pct+"%";
  document.getElementById("countText").textContent=`${d} / ${t} 完了`;
  document.getElementById("chapName").textContent=`「${c.ch}」章`;
  document.getElementById("ringFg").style.strokeDashoffset=144.5*(1-pct/100);
}

if(location.hash==="#admin" && ADMIN_KEY) chap=ADMIN; // 管理者はそのまま管理タブへ
initIdent();
