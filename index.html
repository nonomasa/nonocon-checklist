  });
  box.querySelectorAll(".kcopy").forEach(btn=>{
    btn.onclick=()=>{
      const asin=btn.dataset.asin;
      const ok=()=>{ btn.textContent="✅ コピー済"; setTimeout(()=>{btn.textContent="コピー";},1200); };
      const fallback=()=>{
        const ta=document.createElement("textarea"); ta.value=asin;
        ta.style.position="fixed"; ta.style.opacity="0";
        document.body.appendChild(ta); ta.select();
        try{ document.execCommand("copy"); ok(); }catch(e){ prompt("手動でコピーしてください", asin); }
        document.body.removeChild(ta);
      };
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(asin).then(ok).catch(fallback);
      } else fallback();
    };
  });
  box.querySelectorAll(".ksel").forEach(sel=>{
    kselColor(sel);
    sel.onchange=()=>{
      const brand=sel.dataset.brand, st=sel.value;

      jsonp({action:"ksave", uid:me.sid, name:me.name, brand:brand, status:st}).catch(()=>{});
    };
  });
}

function cacheGet(k){ try{ const x=localStorage.getItem("nonocon_c_"+k); return x?JSON.parse(x):null; }catch(e){ return null; } }

function readImgB64(file){
  return new Promise((res,rej)=>{
    if(!file){ rej("no file"); return; }
    const fr=new FileReader();
    fr.onload=()=>{
      const raw=String(fr.result);
      // ブラウザで自動縮小（長辺1600px・JPEG化）→ サイズ超過やHEICもここで解決
      const img=new Image();
      img.onload=()=>{
        const MAX=1600;
        let w=img.naturalWidth,h=img.naturalHeight;
        if(w>MAX||h>MAX){ const k=MAX/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        const out=cv.toDataURL("image/jpeg",0.85);
        res({data:out.split(",")[1], mime:"image/jpeg", url:out});
      };
      img.onerror=()=>{
        // 画像として読めない形式：縮小せず元のまま（12MB制限のみ）
        if(file.size>12*1024*1024){ rej("この写真は大きすぎます。スクショを撮り直すかJPEGに変換してください"); return; }
        res({data:raw.split(",")[1], mime:file.type||"image/jpeg", url:raw});
      };
      img.src=raw;
    };
    fr.onerror=()=>rej("読み込み失敗");
    fr.readAsDataURL(file);
  });
}
function pickImage(){
  return new Promise(res=>{
    const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*";
    inp.onchange=()=>res(inp.files[0]||null); inp.click();
  });
}

}
function openQuizModal(qid){
  const q=(QUIZALL||[]).find(x=>x.id===qid); if(!q) return;
  document.querySelectorAll(".qovl").forEach(x=>x.remove());
  const ov=document.createElement("div"); ov.className="qovl";
  ov.innerHTML=`<div class="qmodal"><div style="text-align:right"><button class="qmx">✕ 閉じる</button></div>${quizCard(q,!!ADMIN_KEY)}</div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  ov.querySelector(".qmx").onclick=()=>ov.remove();
  bindQuizDetail(ov,qid);
}
function quizCard(q,isAdmin){
  const answers=q.answers||[];
  const myAns=answers.find(a=>String(a.uid)===String(me.sid));
  const answered=!!myAns;
  const canSeeOthers=answered||isAdmin;
  const others=answers.filter(a=>String(a.uid)!==String(me.sid));
  const buyN=answers.filter(a=>a.decision==="仕入れる").length;
  const noN=answers.filter(a=>a.decision==="仕入れない").length;
  const dec=myAns?myAns.decision:"";
  const bigUrl=q.photo?q.photo.replace("/thumbnail?id=","/uc?id=").replace("&sz=w1000",""):"";
  let h=`<div class="qcard">`;
  h+=`<div class="qcardh"><span class="qdate">${escH(dokoDateLabel(q.date))}</span>${q.store?`<span class="qstore">🏬 ${escH(q.store)}</span>`:""}${q.title?`<b class="qtitle">${escH(q.title)}</b>`:""}${isAdmin?`<span style="flex:1"></span><button class="qedit" data-id="${q.id}">編集</button><button class="qdel" data-id="${q.id}">削除</button>`:""}</div>`;
  if(q.memo) h+=`<div class="qmemo">💬 ${escH(q.memo)}</div>`;
  if(q.jan) h+=`<div class="qo-jan">🔖 JAN ${escH(q.jan)} <a href="https://keepa.com/#!search/5-${encodeURIComponent(q.jan)}" target="_blank" rel="noopener">Keepa↗</a></div>`;
  if(q.photo) h+=`<div class="qphoto"><a href="${bigUrl}" target="_blank" rel="noopener"><img src="${q.photo}" alt="仕入れ写真"></a></div>`;
  h+=`<div class="qans">
    <div class="qans-h">🙋 あなたの判断</div>
    <div class="qdec-btns">
      <button class="qdec ${dec==="仕入れる"?"on buy":""}" data-q="${q.id}" data-dec="仕入れる">⭕ 仕入れる</button>
      <button class="qdec ${dec==="仕入れない"?"on no":""}" data-q="${q.id}" data-dec="仕入れない">❌ 仕入れない</button>
    </div>
    <div class="qprice-row">
      <div><label class="glbl">仕入れ値（税込）</label><input class="ginput qans-cost" data-q="${q.id}" inputmode="numeric" placeholder="例：4620" value="${myAns?escH(myAns.cost||""):""}"></div>
      <div><label class="glbl">販売価格</label><input class="ginput qans-price" data-q="${q.id}" inputmode="numeric" placeholder="例：6980" value="${myAns?escH(myAns.price||""):""}"></div>
    </div>
    <label class="glbl">何をどう見て判断した？</label>
    <textarea class="ginput qans-memo" data-q="${q.id}" rows="3" placeholder="例：ランキング○位、利益率○%、月○個回転、ライバル○人、価格推移…">${myAns?escH(myAns.memo):""}</textarea>
    <button class="gbtn qans-save" data-q="${q.id}" style="margin-top:8px">${answered?"回答を更新":"回答する"}</button><span class="gmsg qans-msg" data-q="${q.id}"></span>
  </div>`;
  if(canSeeOthers){
    h+=`<div class="qothers"><button class="qoth-tgl">👥 みんなの回答（⭕${buyN}／❌${noN}）<span class="caret" style="margin-left:6px">▶</span></button><div class="qoth-body" style="display:none">`;
    if(myAns){
      h+=`<div class="qo1 qo-mine"><div class="qo-top"><span class="qo-dec ${myAns.decision==="仕入れる"?"buy":"no"}">${escH(myAns.decision||"—")}</span><b>あなた（${escH(myAns.name)}）</b><span class="dwho">${escH(myAns.updated)}</span></div>`;
      if(myAns.cost||myAns.price) h+=`<div class="qo-jan">💰 仕入${myAns.cost?yen(+myAns.cost)+"円":"—"} → 販売${myAns.price?yen(+myAns.price)+"円":"—"}</div>`;
      if(myAns.memo) h+=`<div class="qo-memo">${escH(myAns.memo)}</div>`;
      h+=`</div>`;
    }
    if(others.length){
      others.forEach(a=>{
        h+=`<div class="qo1"><div class="qo-top"><span class="qo-dec ${a.decision==="仕入れる"?"buy":"no"}">${escH(a.decision||"—")}</span><b>${escH(a.name)}</b><span class="dwho">${escH(a.updated)}</span></div>`;
        if(a.cost||a.price) h+=`<div class="qo-jan">💰 仕入${a.cost?yen(+a.cost)+"円":"—"} → 販売${a.price?yen(+a.price)+"円":"—"}</div>`;
        if(a.photo) h+=`<div class="qo-photo"><a href="${a.photo}" target="_blank" rel="noopener"><img src="${a.photo}"></a></div>`;
        if(a.memo) h+=`<div class="qo-memo">${escH(a.memo)}</div>`;
        h+=`</div>`;
      });
    }else{ h+=`<div class="gpn">まだ他の人の回答はありません</div>`; }
    h+=`</div></div>`;
  }else{
    h+=`<div class="qlock">🔒 他の人の回答は、あなたが回答すると見られます</div>`;
  }
  h+=`</div>`;
  return h;
}
function bindQuizForm(){
  const body=document.getElementById("body");
  const drop=body.querySelector("#qphotoDrop");
  if(!drop) return;
  const prev=body.querySelector("#qphotoPrev");
  const setPhoto=async(file)=>{ try{ const r=await readImgB64(file); quizNewPhoto={data:r.data,mime:r.mime}; prev.src=r.url; prev.style.display=""; drop.textContent="📷 写真を変更する"; }catch(e){ alert(e); } };
  drop.onclick=async()=>{ const f=await pickImage(); if(f) setPhoto(f); };
  drop.ondragover=e=>{ e.preventDefault(); drop.classList.add("drop-on"); };
  drop.ondragleave=()=>drop.classList.remove("drop-on");
  drop.ondrop=e=>{ e.preventDefault(); drop.classList.remove("drop-on"); const f=e.dataTransfer.files[0]; if(f) setPhoto(f); };
  const saveBtn=body.querySelector("#qsaveBtn");
  const cancelBtn=body.querySelector("#qcancelBtn");
  if(cancelBtn) cancelBtn.onclick=()=>{ quizEditId=null; quizNewPhoto=null; renderQuiz(); };
  saveBtn.onclick=async()=>{
    const msg=body.querySelector("#qsaveMsg");
    if(!quizNewPhoto && !quizEditId){ msg.textContent="仕入れ写真を選んでください"; return; }
    saveBtn.disabled=true; msg.textContent=quizEditId?"更新中…":"出題中…";
    try{
      const payload={action:"qsave",pass:PASS,key:ADMIN_KEY,date:todayStr(),title:"",memo:body.querySelector("#qmemo").value.trim(),jan:(body.querySelector("#qjan").value||"").replace(/[^0-9]/g,""),store:body.querySelector("#qstore").value,uid:me.sid,name:me.name};
      if(quizEditId){ payload.id=quizEditId; const ed=QUIZALL.find(x=>x.id===quizEditId); payload.date=(ed&&ed.date)||payload.date; }
      if(quizNewPhoto){ payload.data=quizNewPhoto.data; payload.mime=quizNewPhoto.mime; }
      const d=await (await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},
        body:JSON.stringify(payload)})).json();
      if(d&&d.ok){
        // ローカル即反映（SWRの古いキャッシュを待たない）
        if(quizEditId){ const q=QUIZALL.find(x=>x.id===quizEditId); if(q){ q.memo=payload.memo; q.jan=payload.jan; q.store=payload.store; if(d.photo) q.photo=d.photo; } }
        else QUIZALL.unshift({id:d.id,date:payload.date,title:"",memo:payload.memo,jan:payload.jan,store:payload.store,photo:d.photo||"",uid:String(me.sid),name:me.name,answers:[]});
        cacheSet("qall",QUIZALL);
        const wasEdit=!!quizEditId; quizNewPhoto=null; quizEditId=null; renderQuiz(); showToast(wasEdit?"✅ クイズを更新しました":"✅ 出題しました"); return;
      }
      let em=(d&&d.error)||"不明";
      if(/unauthorized/.test(em)) em="認証エラー：ページ上部の🔑合言葉を入力してください（それでもダメなら #admin を付けて開き直し、管理キーを入れ直し）";
      msg.textContent="失敗："+em; saveBtn.disabled=false;
    }catch(e){ msg.textContent="通信エラー："+String(e).slice(0,80); saveBtn.disabled=false; }
  };
}
function bindQuizDetail(root,qid){
  const tgl=root.querySelector(".qoth-tgl");
  if(tgl) tgl.onclick=()=>{ const b=root.querySelector(".qoth-body"); const open=b.style.display==="none"; b.style.display=open?"":"none"; tgl.querySelector(".caret").textContent=open?"▼":"▶"; };
  root.querySelectorAll(".qedit").forEach(b=>{
    b.onclick=()=>{ quizEditId=b.dataset.id; quizNewPhoto=null; root.remove(); renderQuiz(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  root.querySelectorAll(".qdel").forEach(b=>{
    b.onclick=async()=>{
      if(!confirm("このクイズと全回答を削除しますか？")) return;
      try{ const d=await (await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"qdel",pass:PASS,key:ADMIN_KEY,id:b.dataset.id,uid:me.sid})})).json();
        if(d&&d.ok){ QUIZALL=QUIZALL.filter(x=>x.id!==b.dataset.id); cacheSet("qall",QUIZALL); root.remove(); renderQuiz(); showToast("削除しました"); return; } alert("削除失敗："+(d&&d.error||"不明")); }catch(e){ alert("通信エラー"); }
    };
  });
  root.querySelectorAll(".qdec").forEach(b=>{
    b.onclick=()=>{
      root.querySelectorAll(`.qdec[data-q="${b.dataset.q}"]`).forEach(x=>x.classList.remove("on","buy","no"));
      b.classList.add("on", b.dataset.dec==="仕入れる"?"buy":"no");
    };
  });
  root.querySelectorAll(".qans-save").forEach(btn=>{
    btn.onclick=async()=>{
      const msg=root.querySelector(`.qans-msg[data-q="${qid}"]`);
      const decBtn=root.querySelector(`.qdec.on[data-q="${qid}"]`);
      if(!decBtn){ msg.textContent="「仕入れる／仕入れない」を選んでください"; return; }
      const memo=root.querySelector(`.qans-memo[data-q="${qid}"]`).value.trim();
      const cost=(root.querySelector(`.qans-cost[data-q="${qid}"]`).value||"").replace(/[^0-9]/g,"");
      const price=(root.querySelector(`.qans-price[data-q="${qid}"]`).value||"").replace(/[^0-9]/g,"");
      btn.disabled=true; msg.textContent="保存中…";
      try{
        const payload={action:"qanswer",pass:PASS,quizId:qid,uid:me.sid,name:me.name,decision:decBtn.dataset.dec,memo:memo,cost:cost,price:price};
        const d=await (await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)})).json();
        if(d&&d.ok){
          const q=QUIZALL.find(x=>x.id===qid);
          if(q){ q.answers=(q.answers||[]).filter(a=>String(a.uid)!==String(me.sid)); q.answers.push({uid:String(me.sid),name:me.name,decision:payload.decision,memo:memo,cost:cost,price:price,photo:"",jan:"",updated:"たった今"}); }
          cacheSet("qall",QUIZALL);
          renderQuiz(); openQuizModal(qid); showToast("✅ 回答を保存しました"); return;
        }
        msg.textContent="失敗："+(d&&d.error||"不明"); btn.disabled=false;
      }catch(e){ msg.textContent="通信エラー"; btn.disabled=false; }
    };
  });
}

      const lv = `<span class="lv lvnum" title="${(STAGES.find(x=>x.n===stN)||{}).label||stN}">${stN}</span>`;
      li.innerHTML=`<div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
        <div style="flex:1"><div class="title${it.hot?' st1':''}">${it.t}${lv}</div>${it.n?`<div class="note">${it.n}</div>`:""}${dep}${mov}${gmov}</div>${link}`;
      li.onclick=()=>toggle(it);
      const a=li.querySelector(".ilink");
      if(a) a.onclick=e=>e.stopPropagation(); // リンククリックではチェックを切り替えない
      if(childCount[it.id]){
        const eb=document.createElement("button");
        eb.className="iexp";
        eb.textContent=(openItem[it.id]?"▼":"▶")+" ポイント"+childCount[it.id];
        eb.onclick=e=>{ e.stopPropagation(); openItem[it.id]=!openItem[it.id]; render(); };
        const tt=li.querySelector(".title");
        if(tt) tt.appendChild(eb);
      }
      ul.appendChild(li);
    });
    if(g.g){
      const key=c.ch+"|"+g.g;
      const open = key in openG ? openG[key] : gi===firstOpen;
      const gh=document.createElement("div");
      gh.className="gh acc";
      gh.innerHTML=`<span class="caret">${open?"▼":"▶"}</span>${g.g}<span class="gc">${gdone}/${gt}</span>`;
      gh.onclick=()=>{openG[key]=!open;render();};
      gd.appendChild(gh);
      if(!open) ul.style.display="none";
    }
    gd.appendChild(ul); body.appendChild(gd);
  });
  const {t,d}=chapStats(chap);
  const pct=t?Math.round(d/t*100):0;
  document.getElementById("pctText").textContent=pct+"%";
  document.getElementById("countText").textContent=`${d} / ${t} 完了`;
  document.getElementById("chapName").textContent=`「${c.ch}」章`;
  document.getElementById("ringFg").style.strokeDashoffset=144.5*(1-pct/100);
}

const doFreshReload=e=>{
  if(e) e.preventDefault();
  location.replace(location.pathname+"?v="+Date.now()+location.hash); // キャッシュを避けて読み直す
};
document.getElementById("vreload").onclick=doFreshReload;
document.getElementById("reloadFab").onclick=doFreshReload;

// リロード時は常に準備タブから（#adminは管理キー入力のトリガーとしてだけ使う）
initIdent();
