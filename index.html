<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ののコン スタートアップ チェックリスト</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --line:#e3e6ea; --ink:#1c2430; --sub:#6b7686;
    --head:#1f2937; --accent:#e8744f; --accent-soft:#fdeee8; --done:#0e9f6e; --done-soft:#eafaf2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
  header{background:var(--head);color:#fff;padding:16px 20px 0}
  header .wrap{max-width:860px;margin:0 auto}
  header h1{font-size:17px;font-weight:700}
  header .sub{font-size:12px;color:#cdd5e0;margin:3px 0 14px}
  /* mode toggle */
  .mode{display:inline-flex;background:#0e1620;border-radius:999px;padding:3px;gap:2px;margin-bottom:14px}
  .mode button{background:none;border:none;color:#9aa6b4;font-size:12.5px;font-weight:700;
    padding:7px 16px;border-radius:999px;cursor:pointer}
  .mode button.on{background:var(--accent);color:#fff}
  /* tabs */
  .tabs{display:flex;gap:2px;flex-wrap:wrap}
  .tab{padding:10px 18px;color:#aab4c2;cursor:pointer;border:none;background:none;font-size:13px;
    border-bottom:3px solid transparent;font-weight:600}
  .tab.on{color:#fff;border-bottom-color:var(--accent)}
  .tab .c{opacity:.7;font-size:11px;margin-left:5px}
  /* 名前選択バー */
  .ident{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 12px;
    color:#e6ebf1;font-size:13px}
  .ident select{padding:7px 10px;border-radius:8px;border:1px solid #3a4653;background:#0e1620;
    color:#fff;font-size:13px;min-width:200px}
  .ident .who{font-weight:700;color:#fff}
  .ident button{background:none;border:1px solid #3a4653;color:#cdd5e0;font-size:12px;
    padding:5px 11px;border-radius:999px;cursor:pointer}
  .ident button:hover{border-color:var(--accent);color:var(--accent)}
  .ident .warn{background:#3a2a1e;color:#f0c9b3;padding:4px 10px;border-radius:8px;font-size:12px}

  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
  .modeNote{font-size:12.5px;color:var(--sub);background:var(--accent-soft);
    border-radius:8px;padding:8px 12px;margin-bottom:16px}

  .progress-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 18px;margin-bottom:22px;display:flex;align-items:center;gap:16px}
  .ring{position:relative;width:54px;height:54px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .pmeta{flex:1}
  .pmeta .big{font-size:14px;font-weight:700}
  .pmeta .small{font-size:12px;color:var(--sub)}

  .group{margin-bottom:18px}
  .group .gh{font-size:12px;font-weight:700;color:var(--sub);text-transform:none;
    margin-bottom:7px;display:flex;align-items:center;gap:7px}
  .group .gh .gc{margin-left:auto;font-weight:400;font-size:11px}
  .group .gh.acc{cursor:pointer;user-select:none;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:11px 14px;margin-bottom:7px;font-size:13px}
  .group .gh.acc:hover{border-color:#cfd5dc}
  .group .gh.acc .caret{font-size:10px;color:var(--sub)}
  ul{list-style:none}
  li.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:11px 14px;margin-bottom:7px;display:flex;gap:12px;align-items:flex-start;
    cursor:pointer;transition:.15s}
  li.item:hover{border-color:#cfd5dc}
  .check{width:20px;height:20px;border:2px solid #cdd3da;border-radius:6px;flex:none;margin-top:1px;
    display:flex;align-items:center;justify-content:center;transition:.15s}
  .check svg{width:12px;height:12px;opacity:0;transition:.15s}
  li.done .check{background:var(--done);border-color:var(--done)}
  li.done .check svg{opacity:1}
  li.done{background:var(--done-soft);border-color:#cdeede}
  li.done .title{color:var(--sub);text-decoration:line-through}
  .title{font-size:14px;font-weight:600}
  .title.st1{color:#d3384f}
  .lvbtn.hotbtn{color:#d3384f}
  .note{font-size:12px;color:var(--sub);margin-top:1px}
  .tag{display:inline-block;font-size:10.5px;padding:1px 8px;border-radius:999px;margin-top:5px}
  .tag.watch{background:#eef1f5;color:#7a8696}
  .tag.do{background:#fff0e8;color:#c5663c}
  .tag.mov{background:#e8f1fd;color:#3b74c4;display:inline-flex;align-items:center;gap:3px;padding:2px 9px}
  .tag.mov img{height:11px;display:block}
  .kasin{font-size:11.5px;color:#6b7686;font-weight:400;margin-top:3px;display:flex;align-items:center;gap:6px}
  .kasin span{font-family:ui-monospace,Menlo,monospace;letter-spacing:.3px}
  .kcopy{font-size:10.5px;padding:1px 8px;border:1px solid #d7dce2;border-radius:999px;background:#fff;
    color:#5a6472;cursor:pointer}
  .kcopy:hover{border-color:#f97316;color:#f97316}
  .kothers{max-width:420px;white-space:normal}
  .kchip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;margin:2px 3px 2px 0}
  .kchip a{text-decoration:none}
  .kc-ok{background:#eafaf2;color:#0e9f6e}
  .kc-warn{background:#fef3e2;color:#d97706}
  .kc-blue{background:#eaf1ff;color:#2563eb}
  .kc-gray{background:#eef1f5;color:#6b7686}
  .kcell.kc-pend,.kc-pend{background:#f4effd;color:#7c3aed;font-weight:700}
  .kpdfrow{margin-top:5px;display:flex;align-items:center;gap:8px}
  .kpdflink{font-size:11.5px;color:#2563eb;text-decoration:none;white-space:nowrap}
  .kup{font-size:10.5px;padding:2px 9px;border:1px dashed #c9cfd7;border-radius:999px;background:#fff;color:#5a6472;cursor:pointer;white-space:nowrap}
  .nbar{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .nmonth{font-size:17px;font-weight:800}
  .nnav{font:inherit;font-size:13px;padding:5px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
  .nnav:hover{border-color:#f97316;color:#f97316}
  .nrow2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .nrow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .ncsvrow{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .ntbl{border-collapse:collapse;font-size:13px;min-width:340px}
  .ntbl th,.ntbl td{border:1px solid var(--line);padding:7px 14px;text-align:right}
  .ntbl th:first-child,.ntbl td:first-child{text-align:left;background:#f6f8fa;font-weight:700}
  .ntbl th{background:#eef1f5;color:var(--sub);font-weight:600}
  .nprev{background:#f6f8fa;border:1px solid var(--line);border-radius:10px;padding:14px 16px;
    font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:break-all;margin:6px 0 12px;
    font-family:inherit;max-height:420px;overflow:auto}
  .nmem{margin-bottom:8px}
  .nmemh{font-size:13.5px;font-weight:700;cursor:pointer;user-select:none;padding:9px 12px;
    background:#fff;border:1px solid var(--line);border-radius:10px}
  .nmemh:hover{border-color:#cfd5dc}
  .nhint{font-size:10.5px;color:#8a93a3;margin-top:4px;line-height:1.5}
  .vertag{text-align:center;font-size:10.5px;color:#b6bdc7;margin:26px 0 10px}
  .vertag a{color:#b6bdc7}
  .ncard{background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .ncardh{font-size:12.5px;font-weight:800;margin-bottom:4px;color:#3d4654;
    border-left:4px solid var(--accent);padding-left:8px}
  .nmonth-card{margin-bottom:12px}
  .njun{align-items:start}
  .ntotal td{background:#fdf2e9;font-weight:800}
  .npct{color:#f97316;font-weight:700}
  .nrbody{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;
    padding:14px 16px;margin-top:-4px}
  .nrgoal{background:#fdf6ec;border:1px solid #f3e3c8;border-radius:8px;padding:9px 12px;
    font-size:12.5px;line-height:1.7;margin-bottom:10px}
  .nrsum{display:flex;gap:24px;flex-wrap:wrap;font-size:13px}
  .nrsumi span{color:var(--sub);font-size:11.5px;margin-right:6px}
  .nrsumi b{font-size:15px}
  .nrtodo td{text-align:left;white-space:pre-wrap}
  .nrtodo td:first-child{white-space:nowrap}
  .nrgb{font-size:12.5px;line-height:1.7;margin:6px 0;white-space:pre-wrap}
  .tdrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .tdchk{width:17px;height:17px;flex:none;accent-color:#0e9f6e;cursor:pointer}
  .tdtext{flex:2;min-width:0}
  .tdcmt{flex:3;min-width:0;font-size:12px}
  .tdel{flex:none;width:24px;height:24px;border:1px solid var(--line);border-radius:6px;background:#fff;
    color:#8a93a3;cursor:pointer;font-size:13px;line-height:1}
  .tdel:hover{border-color:#dc2626;color:#dc2626}
  .tdadd{font-size:11.5px;padding:3px 10px;border:1px dashed #c9cfd7;border-radius:999px;background:#fff;
    color:#5a6472;cursor:pointer;margin-top:2px}
  .tdadd:hover{border-color:#f97316;color:#f97316}
  .rtdsec{margin-top:12px}
  .rtdh{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:5px;display:flex;gap:10px;align-items:center}
  .rtdrow{font-size:13px;line-height:1.8}
  .rtdc{color:var(--sub);font-size:12px}
  .ddel,.dedit,.dtoggle{font-size:11px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;
    color:#8a93a3;cursor:pointer;white-space:nowrap}
  .ddel:hover{border-color:#dc2626;color:#dc2626}
  .dedit:hover,.dtoggle:hover{border-color:#f97316;color:#f97316}
  .dcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px}
  .dcardh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ddate{font-weight:800;white-space:nowrap}
  .dplace{font-weight:600}
  .dmeta{font-size:12.5px;color:var(--sub);margin-top:4px}
  .dwho{font-size:10.5px;color:#b6bdc7;margin-top:3px}
  .droutebox{margin-top:10px;overflow-x:auto}
  .drevbox{margin-top:10px;background:#fafbfc;border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;font-size:12.5px;line-height:1.8;white-space:pre-wrap}
  .dcmtbox{margin-top:10px;background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .dcmt1{border-bottom:1px dashed var(--line);padding:6px 0 10px;margin-bottom:6px}
  .dcmth{font-size:12px;font-weight:700}
  .dcmtt{font-size:12.5px;line-height:1.8;white-space:pre-wrap;margin-top:3px}
  .dcmtform{margin-top:8px}
  .dcmtg{margin-bottom:8px}
  .dcmtgh{font-size:11.5px;font-weight:800;color:#3d4654;margin-bottom:3px}
  .dcmto{margin-bottom:10px}
  .dcmtrow{margin-bottom:8px}
  .dcmtlbl{font-size:11.5px;font-weight:700;color:#5a6472;margin-bottom:3px}
  .dmatome{font-size:13px;line-height:1.8;margin-top:10px}
  .dmatome h4{font-size:13px;margin:14px 0 6px;color:#3d4654;border-left:4px solid var(--accent);padding-left:8px}
  .dmatome ul{padding-left:20px;margin:0}
  .dmatome li{margin-bottom:3px}
  .drtbl td,.drtbl th{font-size:12px;padding:6px 10px}
  .drth{font-size:12px;font-weight:800;color:#3d4654;margin-bottom:4px}
  .drphotos{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
  .drph{display:inline-flex;flex-direction:column;align-items:center;text-decoration:none;font-size:9px;color:#8a93a3}
  .drph img{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
  .drph-add{font-size:10px;padding:3px 8px;border:1px dashed #c9cfd7;border-radius:999px;background:#fff;color:#8a93a3;cursor:pointer}
  .drph-add:hover{border-color:#f97316;color:#f97316}
  .drph-add.drop-on{border-style:solid;border-color:#f97316;background:#fff4ec;color:#f97316}
  .drph-group{display:inline-flex;align-items:center;gap:3px;margin-right:8px;padding:2px 4px;border:1px solid var(--line);border-radius:8px}
  .drph-lbl{font-size:9px;color:#8a93a3;margin-right:2px}
  .drph-w{position:relative;display:inline-block}
  .drph-del{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;border:none;background:#dc2626;color:#fff;font-size:10px;line-height:1;cursor:pointer;padding:0}
  .ph-stack{flex:1;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
  .ph-stack img{width:100%;object-fit:contain;background:#1c1f28;border-radius:10px}
  .drmemo{margin-top:4px;font-size:11px;line-height:1.5}
  .drmemo-t{color:#5a6472}
  .drmemo-edit{font-size:10px;padding:1px 7px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#8a93a3;cursor:pointer}
  .drmemo-edit:hover{border-color:#f97316;color:#f97316}
  .drmemo-add{border-style:dashed}
  .slide-memo{margin-top:10px;font-size:16px;color:#e8c37a;max-width:900px;margin-left:auto;margin-right:auto;line-height:1.6}
  .pl-wrap{margin-top:6px}
  .plbox{background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .pltbl{width:100%;font-size:11px}
  .pltbl td,.pltbl th{padding:4px 8px}
  .pltbl .pl-id{text-align:left;white-space:nowrap}
  .pltbl .pl-jan{display:block;font-size:10px;color:var(--sub)}
  .pltbl .pl-asin{font-family:ui-monospace,Menlo,monospace}
  .pltbl .pl-n{text-align:right;white-space:nowrap}
  .pltbl .pl-profit{color:#0e9f6e;font-weight:700}
  .pltbl .pl-k{white-space:nowrap}
  .pltbl .pl-k a{color:#2563eb;text-decoration:none;margin-right:4px}
  .plbtns{margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pl-clear{font-size:10px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#8a93a3;cursor:pointer}
  .pl-clear:hover{border-color:#dc2626;color:#dc2626}
  .rieki-auto{color:#0e9f6e;font-weight:700}
  .slideov{position:fixed;inset:0;background:#12141c;z-index:9999;display:flex;flex-direction:column;color:#fff}
  .slide-top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px}
  .slide-x{background:none;border:1px solid #3a3f4c;color:#fff;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:14px}
  .slide-page{color:#9aa0ad;font-size:14px}
  .slide-body{flex:1;overflow:auto;padding:0 24px;display:flex;flex-direction:column}
  .slide-h{text-align:center;margin-bottom:16px}
  .slide-h b{font-size:26px;display:block}
  .slide-h span{color:#9aa0ad;font-size:15px}
  .slide-imgs{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;justify-content:center}
  .slide-imgs.cover{align-items:center}
  .ph-flow{display:grid;gap:14px;width:100%;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-content:center;justify-items:center}
  .ph-tile{display:flex;flex-direction:column;align-items:center;min-width:0;width:100%;margin:0}
  .ph-tile figcaption{font-size:13px;font-weight:700;text-align:center;margin-bottom:6px;color:#cfd3db}
  .ph-tile img{max-width:100%;max-height:66vh;width:auto;height:auto;object-fit:contain;background:#1c1f28;border-radius:10px}
  .ph-none{color:#5a5f6c;font-size:18px}
  @media (max-width:640px){
    .slide-body{padding:0 12px}
    .slide-h b{font-size:20px}
    .slide-h span{font-size:13px}
    .ph-flow{grid-template-columns:repeat(2,1fr);gap:10px;align-content:start}
    .ph-tile img{max-height:48vh}
    .slide-nav button{padding:12px 24px;font-size:15px}
  }
  /* 仕入れクイズ */
  .quizwrap{max-width:680px;margin:0 auto}
  .quizintro{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.7;color:#7c3a12;margin-bottom:14px}
  .quizform{background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:18px}
  .gh2{font-size:14px;font-weight:800;color:#3d4654;margin-bottom:10px}
  .qphoto-drop{border:2px dashed #c9cfd7;border-radius:10px;padding:20px;text-align:center;color:#8a93a3;cursor:pointer;font-size:13px;background:#fff}
  .qphoto-drop:hover,.qphoto-drop.drop-on{border-color:#f97316;color:#f97316;background:#fff4ec}
  .qphoto-prev{max-width:100%;max-height:260px;border-radius:10px;margin-top:8px;display:block}
  .quizempty{text-align:center;color:#6b7686;padding:30px;font-size:14px}
  .qcard{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .qcardh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .qdate{font-size:12px;color:var(--sub);white-space:nowrap}
  .qtitle{font-size:16px}
  .qdel{font-size:11px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#dc2626;cursor:pointer}
  .qedit{font-size:11px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#6b7686;cursor:pointer;margin-right:4px}
  .qstore{font-size:12px;font-weight:700;color:#7c3aed;background:#f4effd;border-radius:999px;padding:2px 10px;white-space:nowrap}
  .qmemo{font-size:14px;color:#3d4654;margin-bottom:8px}
  .qphoto img{max-width:100%;max-height:360px;border-radius:10px;display:block;margin:0 auto}
  .qans{background:#f7f9fc;border-radius:10px;padding:12px;margin-top:12px}
  .qans-h{font-size:13px;font-weight:800;color:#3d4654;margin-bottom:8px}
  .qdec-btns{display:flex;gap:10px;margin-bottom:6px}
  .qdec{flex:1;padding:12px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:15px;font-weight:700;color:#6b7686;cursor:pointer}
  .qdec.on.buy{border-color:#0e9f6e;background:#eafaf2;color:#0e9f6e}
  .qdec.on.no{border-color:#dc2626;background:#fdeaea;color:#dc2626}
  .qans-drop{margin-top:2px;padding:14px}
  .qans-prev,.qans-photo img{max-width:100%;max-height:220px;border-radius:8px;margin-top:8px;display:block}
  .qothers{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  .qothers-h{font-size:13px;font-weight:800;color:#3d4654;margin-bottom:8px}
  .qo1{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:#fafbfc}
  .qo-mine{border-color:#f9a56a;background:#fff7ed}
  .dlygoals{font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .dlytbl thead th{position:sticky;top:0;background:#eef1f5;z-index:3;box-shadow:0 1px 0 var(--line)}
  .dlytbl tbody td:first-child{position:sticky;left:0;background:#fff;z-index:2;box-shadow:1px 0 0 var(--line)}
  .dlytbl thead th:first-child{position:sticky;left:0;z-index:4}
  .dlytbl tr.djun td:first-child{background:#eef3fb}
  .dlytbl tr.ntotal td:first-child{background:#f2f4f7;z-index:3}
  .dlytbl tr.ntotal td{position:sticky;bottom:0;background:#fdf3e7;z-index:2;box-shadow:0 -1px 0 var(--line);font-weight:700}
  .thsub{font-size:10px;color:#8a93a3;font-weight:400;white-space:nowrap}
  .djun td{background:#eef3fb;font-weight:700;color:#2f4a76;border-top:2px solid #c9d6ea}

/* ---------- スプシ通信（JSONPでCORS回避） ---------- */
async function jsonpOnce(params,timeoutMs){
  if(!API_URL) throw "no-api";
  const q = Object.entries(Object.assign({pass:PASS},params))
    .map(([k,v])=>encodeURIComponent(k)+"="+encodeURIComponent(v)).join("&");
  const ctl=new AbortController();
  const tm=setTimeout(()=>ctl.abort(),timeoutMs||60000);
  try{
    const r=await fetch(API_URL+"?"+q,{signal:ctl.signal});
    const t=await r.text();
    try{ return JSON.parse(t); }
    catch(e){ throw "server-busy"; } // Googleの混雑エラーページ（HTML）が返った
  }finally{ clearTimeout(tm); }
}
/* 混雑時に落ちないよう自動リトライ（2秒→6秒→15秒） */
async function jsonp(params){
  const waits=[0,2000,6000,15000];
  let lastErr;
  for(let i=0;i<waits.length;i++){
    if(waits[i]) await new Promise(r=>setTimeout(r,waits[i]));
    try{ return await jsonpOnce(params); }catch(e){ lastErr=e; }
  }
  throw lastErr;
}

/* 入会表記：WS期生のFSコースは青文字で強調 */
function fmtCohortJoinHtml(m){
  const t = fmtCohortJoin(m);
  const isFS = (m.cohort||"").indexOf("WS")===0 && (m.cohort||"").indexOf("FS")>=0;
  return isFS ? `<span style="color:#2563eb;font-weight:700">${t}</span>` : t;
}

/* 入会年度＋入会年月の合体表記（例：ののコン2024（2025年1月））。「23年9月」→「2023年9月」に補完 */
function fmtCohortJoin(m){
  const jm = String(m.join||"").match(/^(\d{2})年(\d{1,2})月/);
  const jf = jm ? `20${jm[1]}年${jm[2]}月` : String(m.join||"").replace(/-$/,"");
  if(m.cohort && jf) return `${m.cohort}（${jf}）`;
  return m.cohort || jf || "—";
}

/* ---------- 名簿の読み込み ---------- */
async function loadRoster(){
  if(ROSTER.length) return ROSTER;
  const r = await jsonp({action:"roster"});
  if(r && r.error) throw r.error;
  ROSTER = r.students||[];
  return ROSTER;
}

const STAGES=[
  {n:1,label:"1.開始前",short:"開始前"},{n:2,label:"2.アカウント開設",short:"開設"},{n:3,label:"3.初売り上げ",short:"初売り上げ"},

];
let stageOverride=null;   // 手動でステージを見たい時
let STAGE_NUMS=null;      // ステージ判定用の自分の実績（numsのみ）
function stageOfItem(chapterName,it){
  if(it.stage) return it.stage; // 個別指定があれば最優先
  if(chapterName==="準備"||chapterName==="マインド") return 1;
  const l=it.l||1;
  return l===1?3:(l===2?5:6); // 粗割当：⭐1→初売りまで、⭐2→〜50万、⭐3→〜100万
}
function myStageBySales(){
  const nums=(STAGE_NUMS||[]).filter(n=>String(n.uid)===String(me.sid));
  if(!nums.length) return {stage:2,sales:0};
  const byYm={}; nums.forEach(n=>{ byYm[n.ym]=(byYm[n.ym]||0)+n.sales; });
  const yms=Object.keys(byYm).sort((a,b)=>ymSortKey(a)-ymSortKey(b)).slice(-3);
  const mx=Math.max.apply(null,yms.map(y=>byYm[y]).concat([0]));
  let st;
  if(mx<=0) st=3;
  else if(mx<100000) st=4;
  else if(mx<500000) st=5;
  else if(mx<1000000) st=6;
  else if(mx<3000000) st=7;
  else if(mx<5000000) st=8;
  else st=9;
  return {stage:st,sales:mx};
}

  if(behind.length) html+=`<div class="group"><div class="gh">⚠️ 前のステージの残り <span class="gc">${behind.length}件</span></div><ul>${behind.map(row).join("")}</ul></div>`;
  html+=`<div class="group"><div class="gh">📍 今のステージでやること <span class="gc">${now.length}件</span></div><ul>${now.length?now.map(row).join(""):'<li class="item" style="cursor:default"><div style="flex:1">このステージの項目は全部完了です！🎉 次のステージも覗いてみましょう</div></li>'}</ul></div>`;
  body.innerHTML=html;

  body.querySelectorAll(".todo-item").forEach(li=>{
    li.onclick=()=>{ const it=flat[li.dataset.id]; if(it){ toggle(it); } };

}

/* その旬が終わっているか（今日基準）。終わっていない旬は数字が半端なので表示しない */
function junDone(ym,jun){
  const m=String(ym).match(/(\d+)年(\d+)月/); if(!m) return true;
  const y=+m[1], mo=+m[2];
  const now=new Date(), cy=now.getFullYear(), cm=now.getMonth()+1, cd=now.getDate();
  if(y<cy||(y===cy&&mo<cm)) return true;   // 過去の月＝全旬確定
  if(y>cy||(y===cy&&mo>cm)) return false;  // 未来の月
  const last=new Date(y,mo,0).getDate();
  const end={"上旬":10,"中旬":20,"下旬":last}[jun];
  return cd>end;
}
function junWaitLabel(ym,jun){
  const m=String(ym).match(/(\d+)年(\d+)月/);
  const now=new Date(), cd=now.getDate();
  const start={"上旬":1,"中旬":11,"下旬":21}[jun];
  if(m && +m[2]===now.getMonth()+1 && +m[1]===now.getFullYear() && cd>=start) return "進行中（旬の終了後に集計）";
  return "—";
}
function ymShift(ym,delta){const m=ym.match(/(\d+)年(\d+)月/);let y=+m[1],mo=+m[2]+delta;
  while(mo<1){mo+=12;y--;}while(mo>12){mo-=12;y++;}return y+"年"+mo+"月";}

/* RFC4180風の簡易CSVパーサ（引用符内のカンマ・改行対応） */
function parseCSV(text){
  const rows=[];let row=[],cell="",inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else inQ=false; }
      else cell+=c;
    }else{
      if(c==='"') inQ=true;
      else if(c===','){row.push(cell);cell="";}
      else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell="";}
      else if(c!=='\r') cell+=c;
    }
  }
  if(cell!==""||row.length){row.push(cell);rows.push(row);}
  return rows;
}

async function parsePricetar(file){
  const buf=await file.arrayBuffer();
  let text="";
  try{ text=new TextDecoder("shift_jis").decode(buf); }catch(e){}
  if(text.indexOf("注文日")<0){ text=new TextDecoder("utf-8").decode(buf); }
  if(text.indexOf("注文日")<0) throw "プライスターの注文CSVではないようです（「注文日」列が見つかりません）";
  const rows=parseCSV(text);
  const head=rows[0];
  const ci={date:head.indexOf("注文日"),unit:head.indexOf("単価"),qty:head.indexOf("売れた個数"),
    profit:head.indexOf("粗利益"),status:head.indexOf("出荷状態")};
  if(ci.date<0||ci.unit<0||ci.qty<0||ci.profit<0) throw "必要な列（注文日・単価・売れた個数・粗利益）が見つかりません";
  const num=x=>{const v=parseFloat(String(x).replace(/,/g,""));return isNaN(v)?0:v;};
  const byMonth={};
  let skipped=0;
  for(let r=1;r<rows.length;r++){
    const raw=rows[r][ci.date]; if(!raw) continue;
    /* 集計から外す行（プライスターの売上分析と同じ扱い）
       ・キャンセル＝売れていない
       ・保留中(Pending)＝金額未確定。単価0で原価だけ計上され粗利が大きくマイナスになる
         → 出荷されれば次回の取り込みでShippedとして正しく計上される */
    if(ci.status>=0){
      const st=String(rows[r][ci.status]||"").toLowerCase();
      if(st.indexOf("cancel")>=0||st.indexOf("キャンセル")>=0||
         st.indexOf("pending")>=0||st.indexOf("保留")>=0){ skipped++; continue; }
    }
    // 出荷状態の列がない形式でも、金額未確定（単価0で粗利マイナス）の行は除外
    if(num(rows[r][ci.unit])===0 && num(rows[r][ci.profit])<0){ skipped++; continue; }
    const m=String(raw).match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/); if(!m) continue;
    const ym=(+m[1])+"年"+(+m[2])+"月", day=+m[3];
    const jun=day<=10?"上旬":(day<=20?"中旬":"下旬");
    const qty=num(rows[r][ci.qty])||1;
    const o=byMonth[ym]=byMonth[ym]||{"上旬":{sales:0,profit:0,cnt:0},"中旬":{sales:0,profit:0,cnt:0},"下旬":{sales:0,profit:0,cnt:0}};
    o[jun].sales+=num(rows[r][ci.unit])*qty;
    o[jun].profit+=num(rows[r][ci.profit]);
    o[jun].cnt+=qty;
  }
  byMonth.__skipped=skipped;
  return byMonth;
}

/* プライスター在庫CSVの解析（editUploadProduct形式：number/price/cost。="…"形式や日本語列名にも対応） */
async function parseZaiko(file){
  const buf=await file.arrayBuffer();
  let text="";
  try{ text=new TextDecoder("shift_jis").decode(buf); }catch(e){}
  if(!/number|在庫/.test(text)){ text=new TextDecoder("utf-8").decode(buf); }
  const rows=parseCSV(text);
  if(rows.length<2) throw "データ行がありません";
  const head=rows[0].map(h=>String(h).trim().toLowerCase());
  const find=cands=>{ for(const c of cands){ const i=head.indexOf(c); if(i>=0) return i; }
    for(const c of cands){ const i=head.findIndex(h=>h.indexOf(c)>=0); if(i>=0) return i; } return -1; };
  const ci={stock:find(["number","在庫数","在庫"]),price:find(["price","出品価格","販売価格"]),cost:find(["cost","仕入れ価格","仕入価格","原価"])};
  if(ci.stock<0) throw "在庫数（number）の列が見つかりません。プライスターの「現在庫のダウンロード」のCSVを選んでください";
  const num=x=>{const v=parseFloat(String(x).replace(/^="?|"$/g,"").replace(/,/g,""));return isNaN(v)?0:v;};
  let cnt=0,sales=0,cost=0;
  for(let r=1;r<rows.length;r++){
    if(rows[r].length<=ci.stock) continue;
    const st=num(rows[r][ci.stock]); if(!st) continue;
    cnt+=st;
    if(ci.price>=0) sales+=num(rows[r][ci.price])*st;
    if(ci.cost>=0) cost+=num(rows[r][ci.cost])*st;
  }
  return {cnt:cnt, sales:Math.round(sales), cost:Math.round(cost),
          hasPrice:ci.price>=0, hasCost:ci.cost>=0};
}

function parseTodos(v,legacyResult){
  let items=[];

    try{ const a=JSON.parse(v); if(Array.isArray(a)) items=a.map(x=>({t:String(x.t||""),d:!!x.d,c:String(x.c||"")})); }
    catch(e){ items=String(v).split(/\n/).map(t=>t.trim()).filter(Boolean).map(t=>({t:t.replace(/^[・\-\s]+/,""),d:false,c:""})); }
  }
  if(legacyResult&&String(legacyResult).trim()){
    items.push({t:"（旧・結果メモ）",d:false,c:String(legacyResult).trim()});
  }
  return items;
}

  }).map(x=>x[0]);

/* せどプレの行コピペ（タブ区切り・ヘッダ無し）をパース。列位置はCSVと同じ */
function sedoprePasteParse(text){
  const raw=String(text).replace(/\r/g,"");
  const num=x=>{const v=parseFloat(String(x).replace(/,/g,""));return isNaN(v)?0:v;};
  // タブ区切り（Excel/スプシコピー）が基本。タブが無ければCSVとして解釈
  let rowsArr;
  if(raw.indexOf("\t")>=0){
    rowsArr=raw.split("\n").filter(l=>l.trim()).map(l=>l.split("\t").map(x=>x.trim()));
  }else{
    rowsArr=parseCSV(raw).filter(r=>r.some(x=>String(x).trim()));
  }
  const out=[];
  rowsArr.forEach(c=>{
    c=c.map(x=>String(x).trim());
    const l=c.join("\t");
    // SKU（1列目）から ASIN・個数・仕入原価 を確実に取得
    const parts=(c[0]||"").split("-");
    let asin="", qty=1, cost=0, ai=-1;
    for(let k=0;k<parts.length;k++){ if(/^[A-Z0-9]{10}$/.test(parts[k])){ asin=parts[k]; ai=k; break; } }
    if(ai>=0){ qty=num(parts[ai+2])||1; cost=num(parts[ai+3]); }
    // SKUで取れなければ列/正規表現で補完
    if(!asin){ asin=(c[2]||""); if(!/^[A-Z0-9]{10}$/.test(asin)){ const m=l.match(/\b([A-Z0-9]{10})\b/); asin=m?m[1]:""; } }
    if(!asin) return;
    // JAN：2列目が8〜13桁ならそれ。指数表記(E+)や小数は桁欠落なので採用せず、行内の13桁を探す
    const rawJan=String(c[1]||"").trim();
    let jan=(/^\d{8,13}$/.test(rawJan))?rawJan:"";
    if(!jan){ const jm=l.match(/\b(\d{13})\b/); jan=jm?jm[1]:""; }
    // 粗利＝「仕入原価・個数」が並ぶ直前の数値。販売価格＝個数の直後の数値（出品予定価格）
    let profit=0, price=0, pIdx=-1;
    if(cost>0){
      for(let i=0;i<c.length-2;i++){ if(num(c[i+1])===cost && num(c[i+2])===qty){ profit=num(c[i]); pIdx=i; price=num(c[i+3])||0; break; } }
    }
    // 仕入日：SKU先頭の8桁（20260718-...）→ 2026-07-18
    let dt=""; const dm=(c[0]||"").match(/^(\d{4})(\d{2})(\d{2})-/); if(dm) dt=dm[1]+"-"+dm[2]+"-"+dm[3];
    out.push({asin:asin, jan:jan, profit:profit, cost:cost, price:price, qty:qty, dt:dt});
  });
  return out;
}
function sedopreParse(text){
  const rows=parseCSV(text);
  if(!rows.length) throw "CSVが読めません";
  const head=rows[0].map(h=>String(h).trim());
  const ci={asin:head.indexOf("ASIN"),jan:head.indexOf("JAN"),title:head.indexOf("タイトル"),
    profit:head.indexOf("粗利"),cost:head.indexOf("仕入原価"),
    price:head.indexOf("出品予定価格"),qty:head.indexOf("個数")};
  if(ci.asin<0) throw "ASIN列が見つかりません（せどプレのCSVを選んでください）";
  const num=x=>{const v=parseFloat(String(x).replace(/,/g,""));return isNaN(v)?0:v;};
  const janFix=x=>{ // 指数表記(4.9886E+12)は桁欠落するので表示しない。8〜13桁の数字だけ採用
    x=String(x||"").trim();
    if(/e\+/i.test(x)||/\./.test(x)) return "";
    return /^\d{8,13}$/.test(x)?x:"";
  };
  const out=[];
  for(let r=1;r<rows.length;r++){
    const asin=String(rows[r][ci.asin]||"").trim();
    if(!asin) continue;
    let dt=""; const skuv=String(rows[r][0]||""); const dm=skuv.match(/^(\d{4})(\d{2})(\d{2})-/); if(dm) dt=dm[1]+"-"+dm[2]+"-"+dm[3];
    out.push({asin:asin, jan:ci.jan>=0?janFix(rows[r][ci.jan]):"",
      profit:ci.profit>=0?num(rows[r][ci.profit]):0, cost:ci.cost>=0?num(rows[r][ci.cost]):0,
      price:ci.price>=0?num(rows[r][ci.price]):0, qty:ci.qty>=0?(num(rows[r][ci.qty])||1):1, dt:dt});
  }
  return out;
}

  box.innerHTML=`<div style="text-align:right;margin-bottom:6px"><button class="gbtn dslide" data-id="${rid}">📷 スライド表示</button></div>`+tbl;
  if(_bindRouteBox) _bindRouteBox(box);
  box.style.display="";
}
/* ローカルのDOKOALLとPHOTOCTXに1件の変更を反映（サーバー往復せず即時） */
function applyPhotoLocal(rid,shop,kind,url,mode){
  const r=(DOKOALL||[]).find(x=>x.id===rid); if(!r) return;
  r.photos=r.photos||[];
  if(mode==="del-one"){ r.photos=r.photos.filter(p=>!(p.shop===shop&&p.kind===kind&&p.url===url)); }
  else if(mode==="del-all"){ r.photos=r.photos.filter(p=>!(p.shop===shop&&p.kind===kind)); }
  else if(mode==="set"){ r.photos=r.photos.filter(p=>!(p.shop===shop&&p.kind===kind)); if(url) r.photos.push({shop,kind,url}); }
  else if(mode==="add"){ r.photos.push({shop,kind,url}); }
  // PHOTOCTX再構築（この同行だけ）
  PHOTOCTX[rid]={};
  r.photos.forEach(p=>{const sh=PHOTOCTX[rid][p.shop]=PHOTOCTX[rid][p.shop]||{}; if(p.kind==="memo"||p.kind==="products"){sh[p.kind]=p.url;} else {(sh[p.kind]=sh[p.kind]||[]).push(p.url);}});
}
function photoCell(rid,shopKey){
  const m=(PHOTOCTX[rid]||{})[shopKey]||{};
  const memo=m.memo||"";
  const canEdit=canEditDokoId(rid);
  const photos=`<div class="drphotos">`+PHOTO_KINDS.map(k=>{
    const urls=m[k[0]]||[];
    if(!urls.length && !canEdit) return ""; // 閲覧者には空の枠を出さない
    const imgs=urls.map(u=>
      `<span class="drph-w"><a class="drph" href="${u}" target="_blank" rel="noopener" title="${k[1]}"><img src="${u}" alt="${k[1]}"></a>`+
      `${canEdit?`<button class="drph-del" data-rid="${rid}" data-shop="${escH(shopKey)}" data-kind="${k[0]}" data-url="${escH(u)}" title="削除">×</button>`:""}</span>`).join("");
    return `<span class="drph-group"><span class="drph-lbl">${k[1]}</span>${imgs}`+
      `${canEdit?`<button class="drph-add" data-rid="${rid}" data-shop="${escH(shopKey)}" data-kind="${k[0]}" title="${k[1]}の写真を追加">＋</button>`:""}</span>`;
  }).join("")+`</div>`;
  const memoLine=memo
    ? `<div class="drmemo"><span class="drmemo-t">📝 ${escH(memo)}</span> ${canEdit?`<button class="drmemo-edit" data-rid="${rid}" data-shop="${escH(shopKey)}">編集</button>`:""}</div>`
    : (canEdit?`<div class="drmemo"><button class="drmemo-edit drmemo-add" data-rid="${rid}" data-shop="${escH(shopKey)}">＋メモ（店の特徴）</button></div>`:"");
  let prodArr=[]; try{ prodArr=JSON.parse(((PHOTOCTX[rid]||{})[shopKey]||{}).products||"[]"); }catch(e){}
  const prodLine=(prodArr.length||canEdit)
    ? `<div class="drmemo"><button class="drmemo-edit pl-toggle" data-rid="${rid}" data-shop="${escH(shopKey)}">🛒 商品リスト（${prodArr.length}）</button></div><div class="pl-wrap" data-plwrap="${rid}__${escH(shopKey)}" style="display:none">${productListHtml(rid,shopKey)}</div>`
    : "";
  return photos+memoLine+prodLine;
}
const drName=x=>(x.ch?x.ch+(x.n?" "+x.n:""):x.n);
const drKey=x=>drName(x).replace(/\s+/g,"");
/* 同行の編集可否：参加メンバー本人・作成者・管理者のみ編集可（他は閲覧のみ） */
function dokoMembers(r){ return String((r&&r.members)||"").split(/[・、,／]+/).map(s=>s.trim()).filter(Boolean); }
function canEditDokoId(rid){
  const r=(DOKOALL||[]).find(x=>String(x.id)===String(rid));
  if(!r||!me) return false;
  if(ADMIN_KEY) return true;
  if(String(r.uid)===String(me.sid)) return true;
  return dokoMembers(r).includes(me.name);
}
function productTotal(rid,shopKey){
  const pj=((PHOTOCTX[rid]||{})[shopKey]||{}).products;
  if(!pj) return null;
  let items=[]; try{ items=JSON.parse(pj); }catch(e){ return null; }
  if(!items.length) return null;
  return items.reduce((a,x)=>a+(Number(x.profit)||0)*(Number(x.qty)||1),0);
}
function riekiCellHtml(rid,x){
  const pt=rid?productTotal(rid,drKey(x)):null;
  if(pt!=null) return `<span class="rieki-auto" title="商品リストの合計">${yen(pt)}円</span>`;
  return x.r?yen(x.r)+"円":"";
}
function riekiVal(rid,x){
  const pt=rid?productTotal(rid,drKey(x)):null;
  return pt!=null?pt:drNum(x.r);
}

/* 単一ルート表（計画のみ／実際のみ）。実際(分)列は廃止 */
function routeTableHtml(route,RID){
  if(!route.length) return "";
  route=sortRoute(route);
  const tp=route.reduce((a,x)=>a+drNum(x.p),0), tr=route.reduce((a,x)=>a+drNum(x.r),0);
  return `<table class="ntbl drtbl"><thead><tr><th>時間</th><th>マスト</th><th>店名・場所名</th><th>種類</th><th>予定(分)</th><th>見込利益(円)</th></tr></thead><tbody>`+
    route.map(x=>{
      const end=x.e||addMinutes(x.s,drNum(x.p));
      const nm=drName(x);
      const nmCell=x.in?`<span class="drin-nm">└ ${escH(nm)}</span>`:escH(nm);
      const ph=RID?photoCell(RID,drKey(x)):"";
      return `<tr${x.in?' class="drin-row"':""}><td style="white-space:nowrap">${escH(x.s)}${end?`〜${escH(end)}`:""}</td>`+
      `<td style="text-align:center">${escH(x.m)}</td><td style="text-align:left">${nmCell}${ph}</td><td style="text-align:left">${escH(x.k)}</td>`+
      `<td>${x.p?escH(x.p):""}</td><td>${riekiCellHtml(RID,x)}</td></tr>`;}).join("")+
    `<tr class="ntotal"><td colspan="4">合計</td><td>${tp||""}</td><td>${(()=>{const t=route.reduce((a,x)=>a+riekiVal(RID,x),0);return t?yen(t)+"円":"";})()}</td></tr>`+
    `</tbody></table>`;
}

/* 計画と実際を1つに統合した表：追加=青＋「当」、変更=青、未訪問=グレー取消線 */
function routeMergedHtml(actual, plan, RID){
  const planMap={}; plan.forEach(x=>{planMap[drKey(x)]=x;});
  const actMap={}; actual.forEach(x=>{actMap[drKey(x)]=x;});
  // 実際に回った店（時刻順）＋計画にあって行かなかった店（末尾）
  const rows=[];
  sortRoute(actual).forEach(x=>rows.push({x, kind: planMap[drKey(x)]?"kept":"added"}));
  sortRoute(plan).forEach(x=>{ if(!actMap[drKey(x)]) rows.push({x, kind:"skipped"}); });
  const tp=actual.reduce((a,x)=>a+drNum(x.p),0), tr=actual.reduce((a,x)=>a+riekiVal(RID,x),0);
  let body="";
  rows.forEach(({x,kind})=>{
    const p0=planMap[drKey(x)];
    const end=addMinutes(x.s,drNum(x.p));
    const nm=drName(x);
    const nmCell=x.in?`<span class="drin-nm">└ ${escH(nm)}</span>`:escH(nm);
    const ph=RID?photoCell(RID,drKey(x)):"";
    let cls="", mustCell=escH(x.m||"");
    if(kind==="added"){ cls="dr-add"; mustCell=`<span class="dr-touban">当</span>`; }
    else if(kind==="skipped"){ cls="dr-skip"; }
    // 時間セル：変更なら元の時間帯を取り消し線で残す
    const timeStr=`${escH(x.s)}${end?`〜${escH(end)}`:""}`;
    let timeCell=timeStr, timeChg="";
    if(p0&&kind==="kept"){
      const pEnd=addMinutes(p0.s,drNum(p0.p));
      const pStr=`${escH(p0.s)}${pEnd?`〜${escH(pEnd)}`:""}`;
      if(pStr!==timeStr){ timeChg="dr-chg"; timeCell=`<span class="dr-old">${pStr}</span><br>${timeStr}`; }
    }
    // 予定分セル：変更なら元の分を取り消し線で残す
    let pCell=x.p?escH(x.p):"", pChg="";
    if(p0&&kind==="kept"&&drNum(x.p)!==drNum(p0.p)){
      pChg="dr-chg"; pCell=`<span class="dr-old">${escH(p0.p)}</span> ${x.p?escH(x.p):""}`;
    }
    body+=`<tr class="${cls}${x.in?" drin-row":""}">`+
      `<td style="white-space:nowrap" class="${timeChg}">${timeCell}</td>`+
      `<td style="text-align:center">${mustCell}</td>`+
      `<td style="text-align:left">${nmCell}${ph}</td>`+
      `<td style="text-align:left">${escH(x.k)}</td>`+
      `<td class="${pChg}">${pCell}</td>`+
      `<td>${riekiCellHtml(RID,x)}</td></tr>`;
  });
  return `<table class="ntbl drtbl"><thead><tr><th>時間</th><th>マスト</th><th>店名・場所名</th><th>種類</th><th>予定(分)</th><th>見込利益(円)</th></tr></thead><tbody>`+
    body+`<tr class="ntotal"><td colspan="4">合計</td><td>${tp||""}</td><td>${tr?yen(tr)+"円":""}</td></tr></tbody></table>`+
    `<div class="drlegend"><span class="dr-touban">当</span> 当日追加　<span class="dr-chg-legend">青字</span>＝計画から変更　<span class="dr-skip-legend">取消線</span>＝計画したが未訪問</div>`;
}
/* 同行スライド表示（全画面。1店舗ずつ 情報＋3枚の写真を大きく） */
function openSlide(rid){
  const r=(DOKOALL||[]).find(x=>x.id===rid); if(!r) return;
  const route=sortRoute(parseRoute(r.route));
  const pmap={}; (r.photos||[]).forEach(p=>{const sh=pmap[p.shop]=pmap[p.shop]||{}; if(p.kind==="memo"||p.kind==="products"){sh[p.kind]=p.url;} else {(sh[p.kind]=sh[p.kind]||[]).push(p.url);}});
  // 全体＋各店舗のスライド
  const slides=[{title:`${dokoDateLabel(r.date)} ${escH(r.place)}`, sub:escH(r.members||""), shop:null}]
    .concat(route.map(x=>{
      const info=[x.s||"", x.k||"", x.r?("見込利益 "+yen(x.r)+"円"):""].filter(Boolean).join("　");
      return {title:drName(x), sub:escH(info), shop:drKey(x), memo:(pmap[drKey(x)]||{}).memo||""};
    }));
  let i=0;
  const ov=document.createElement("div"); ov.className="slideov";
  const render=()=>{
    const sl=slides[i];
    const ph=sl.shop?(pmap[sl.shop]||{}):{};
    let imgs;
    if(!sl.shop){
      imgs=`<div class="slide-cover">🚗 同行スタート<br><span>${escH(r.memo||"")}</span></div>`;
    }else{
      const tiles=[];
      PHOTO_KINDS.forEach(k=>{ (ph[k[0]]||[]).forEach(u=>tiles.push(`<figure class="ph-tile"><figcaption>${k[1]}</figcaption><img src="${u}" alt="${k[1]}"></figure>`)); });
      imgs=tiles.length?`<div class="ph-flow">${tiles.join("")}</div>`:`<div class="ph-none">この店舗の写真はまだありません</div>`;
    }
    ov.innerHTML=`<div class="slide-top"><button class="slide-x">✕ 閉じる</button><span class="slide-page">${i+1} / ${slides.length}</span></div>
      <div class="slide-body">
        <div class="slide-h"><b>${sl.title}</b><span>${sl.sub}</span>${sl.memo?`<div class="slide-memo">📝 ${escH(sl.memo)}</div>`:""}</div>
        <div class="slide-imgs ${sl.shop?"":"cover"}">${imgs}</div>
      </div>
      <div class="slide-nav">
        <button class="slide-prev" ${i===0?"disabled":""}>← 前</button>
        <button class="slide-next" ${i===slides.length-1?"disabled":""}>次 →</button>
      </div>`;
    ov.querySelector(".slide-x").onclick=close;
    const prev=ov.querySelector(".slide-prev"), next=ov.querySelector(".slide-next");
    if(prev) prev.onclick=()=>{ if(i>0){i--;render();} };
    if(next) next.onclick=()=>{ if(i<slides.length-1){i++;render();} };
  };
  const key=e=>{ if(e.key==="ArrowRight"||e.key===" "){ if(i<slides.length-1){i++;render();} } else if(e.key==="ArrowLeft"){ if(i>0){i--;render();} } else if(e.key==="Escape"){ close(); } };
  const close=()=>{ document.removeEventListener("keydown",key); ov.remove(); };
  document.addEventListener("keydown",key);
  document.body.appendChild(ov);
  render();
}

/* 解除目標（数字報告×制限解除の連動）。目標はここで宣言、達成は制限解除タブのステータスから自動判定 */
function kgoalBrandsOf(uid,ym){ const r=(KGOALS||[]).find(x=>String(x.uid)===String(uid)&&x.ym===ym); if(!r) return []; try{ return JSON.parse(r.brands)||[]; }catch(e){ return []; } }
function kaijoStatusOf(uid,brand){ const r=(ALLKAIJO||[]).find(x=>String(x.uid)===String(uid)&&x.brand===brand); return r?r.status:""; }
const kgAchieved=v=>v==="制限なし"||String(v).indexOf("解除")>=0;
function kgoalChipsHtml(uid,editable){
  const sel=kgoalBrandsOf(uid,numsMonth);
  const chips=sel.map(b=>{ const st=kaijoStatusOf(uid,b); const ok=kgAchieved(st);
    return `<span class="kgchip${ok?" on":""}" title="${escH(st||"未確認")}">${ok?"✅":"🎯"} ${escH(b)}${st&&st!=="未確認"&&!ok?`<i>${escH(st)}</i>`:""}${editable?`<button class="kgx" data-b="${escH(b)}">×</button>`:""}</span>`; }).join("");
  const done=sel.filter(b=>kgAchieved(kaijoStatusOf(uid,b))).length;
  const prog=sel.length?`<span class="gpn" style="margin-left:6px;font-weight:700;${done>=sel.length?"color:#0e9f6e":""}">${done}/${sel.length}達成</span>`:"";
  const cand=(BRANDS||[]).filter(b=>!sel.includes(b.brand)&&!kgAchieved(kaijoStatusOf(uid,b.brand)));
  const priG={}; cand.forEach(b=>{ (priG[b.pri||"その他"]=priG[b.pri||"その他"]||[]).push(b); });
  const add=editable?`<select class="ginput" id="kgoalAdd" style="max-width:260px;font-size:13px;padding:6px 10px"><option value="">＋ブランドを追加（優先度順）</option>${Object.keys(priG).map(pri=>`<optgroup label="${escH(pri)}">`+priG[pri].map(b=>`<option value="${escH(b.brand)}">${escH(b.brand)}</option>`).join("")+`</optgroup>`).join("")}</select>`:"";
  // 現在解除済みのメーカー（優先度順）：何ができていて今月何にチャレンジ中かをひと目で
  const cleared=(BRANDS||[]).filter(b=>!sel.includes(b.brand)&&kgAchieved(kaijoStatusOf(uid,b.brand)));
  const clearedHtml=cleared.length?`<div class="kgrow" style="margin-top:8px"><span class="gpn" style="font-weight:700">✅ 解除済み（${cleared.length}）</span>${cleared.map(b=>`<span class="kgdone" title="${escH(kaijoStatusOf(uid,b.brand))}">${escH(b.brand)}</span>`).join("")}</div>`:"";
  return `<div class="kgrow">${chips||(editable?"":'<span class="gpn">未設定</span>')}${add}${prog}</div>${clearedHtml}`;
}
function bindKgoal(){
  const wrap=document.getElementById("kgoalWrap"); if(!wrap) return;
  const save=async list=>{
    try{ await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"kgsave",pass:PASS,uid:me.sid,name:me.name,ym:numsMonth,brands:JSON.stringify(list)})}); }catch(e){}
    const r=(KGOALS||[]).find(x=>String(x.uid)===String(me.sid)&&x.ym===numsMonth);
    if(r) r.brands=JSON.stringify(list); else (KGOALS=KGOALS||[]).push({uid:String(me.sid),ym:numsMonth,brands:JSON.stringify(list)});
    wrap.innerHTML=kgoalChipsHtml(me.sid,true); bindKgoal(); showToast("✅ 解除目標を保存しました");
  };
  const ad=document.getElementById("kgoalAdd");
  if(ad) ad.onchange=()=>{ if(!ad.value) return; const list=kgoalBrandsOf(me.sid,numsMonth); if(!list.includes(ad.value)) list.push(ad.value); save(list); };
  wrap.querySelectorAll(".kgx").forEach(x=>{ x.onclick=()=>{ save(kgoalBrandsOf(me.sid,numsMonth).filter(b=>b!==x.dataset.b)); }; });

  const futRow=(fC||fM||fH||fV||fS)?`<tr class="djun" style="opacity:.8"><td>📝 予定計（今月）</td><td class="pl-n">${fC?yen(fC)+"円":""}</td><td class="pl-n">${fM?yen(fM)+"円":""}</td><td class="pl-n">${fH||""}</td><td class="pl-n">${fV||""}</td><td class="pl-n">${fS?yen(fS):""}</td><td></td></tr>`:"";
  const total=futRow+`<tr class="ntotal"><td>実績累計${isCurMonth?"（今日まで）":""}<div class="thsub">🎯目標比</div></td><td class="pl-n">${tC?yen(tC)+"円":""}</td>`+
    `<td class="pl-n">${tM?yen(tM)+"円":""}${pctS(tM,goal.gmikomi)}</td>`+
    `<td class="pl-n">${tH||""}${pctS(tH,goal.ghours)}</td>`+
    `<td class="pl-n">${tV||""}${pctS(tV,goal.gvisits)}</td>`+
    `<td class="pl-n">${tS?yen(tS):""}${pctS(tS,goal.gsearches)}</td><td></td></tr>`;
  const gIn=(k,ph)=>editable
    ? `<input class="ginput dlyg" data-k="${k}" inputmode="numeric" style="width:90px;text-align:right;padding:5px 8px" placeholder="${ph}" value="${goal[k]||""}">`
    : `<b>${goal[k]?yen(numv(goal[k])):"—"}</b>`;
  return `<div class="gpanel"><div class="gph">📅 デイリー行動記録</div>
    <div class="dlygoals">🎯 今月の目標：見込利益 ${gIn("gmikomi","300000")}円　時間 ${gIn("ghours","100")}h　回訪 ${gIn("gvisits","100")}店　検索 ${gIn("gsearches","10000")}件
    ${editable?`<button class="gbtn dlyg-save" style="margin-left:8px;padding:6px 14px;font-size:12px">目標を保存</button>
    <button class="gbtn" id="dlygFromTrend" style="padding:6px 14px;font-size:12px;background:#6b7686" title="月次推移で立てた目標粗利をここに入れる">月次推移から反映</button>`:""}</div>
    ${(()=>{  // 日割りペースと着地予測
      const passedDays=(numsMonth===ymNow())?new Date().getDate():dim;
      const lines=[];
      const pace=(label,goalV,actV,unit)=>{
        const g=numv(goalV); if(!g) return;
        const perDay=g/dim;
        let t=`${label}：1日あたり ${unit==="円"?yen(Math.round(perDay))+"円":(Math.round(perDay*10)/10)+unit}`;
        if(actV>0&&passedDays>0&&numsMonth===ymNow()){
          const land=actV/passedDays*dim;
          const okc=land>=g?"#0e9f6e":"#dc2626";
          t+=`　→ 今のペースだと月末 <b style="color:${okc}">${unit==="円"?yen(Math.round(land))+"円":Math.round(land)+unit}</b>`;
        }
        lines.push(t);
      };
      pace("見込利益",goal.gmikomi,tM,"円");
      pace("時間",goal.ghours,tH,"h");
      pace("回訪",goal.gvisits,tV,"店");
      pace("検索",goal.gsearches,tS,"件");
      return lines.length?`<div class="dlypace">${lines.join("　｜　")}</div>`:"";
    })()}
    ${editable?`<div class="nhint" style="margin-bottom:6px">目標を入れるのは上の🎯欄だけ。下の表には<b>毎日の実際</b>を入力します（仕入金額・見込利益はせどプレ取り込みで自動）</div>`:""}
    ${editable?`<div class="nhint" style="margin-bottom:6px">仕入金額・見込利益は一番上の「📥 データ取り込み」から自動入力できます</div>`:""}
    ${editable?`<div style="margin:6px 0"><button class="modebtn dlymode${dlyMode==="actual"?" on":""}" data-dm="actual">✅ 実績を入れる</button>
      <button class="modebtn dlymode plan${dlyMode==="plan"?" on":""}" data-dm="plan">📝 予定を入れる</button>
      <span class="gpn" style="margin-left:6px">${dlyMode==="plan"?"予定モード：青い欄に計画を入力（実績とは別に保存されます）":"実績モード：やった分を入力"}</span></div>`:""}
    <div style="overflow-x:auto;max-height:420px;overflow-y:auto"><table class="ntbl pltbl dlytbl"><thead><tr><th>日付</th>
    <th>仕入金額<div class="thsub">せどプレから自動</div></th>
    <th>見込利益<div class="thsub">せどプレから自動</div></th>
    <th>時間<div class="thsub">実際↓／目標 ${goal.ghours?yen(numv(goal.ghours))+"h":"未設定"}</div></th>
    <th>回訪<div class="thsub">実際↓／目標 ${goal.gvisits?yen(numv(goal.gvisits))+"店":"未設定"}</div></th>
    <th>検索<div class="thsub">実際↓／目標 ${goal.gsearches?yen(numv(goal.gsearches))+"件":"未設定"}</div></th>
    <th>店舗・チェーン<div class="thsub">回った店をスペース区切りで</div></th></tr></thead><tbody>${body_}${total}</tbody></table></div>
    ${editable?`<button class="gbtn" id="dlySave" style="margin-top:8px">デイリーを保存</button>
    <button class="gbtn" id="dlyCopy" style="margin-top:8px;background:#2563eb" title="日報を作ってLINE用テキストをコピー">📋 日報を作る（LINE用コピー）</button><span class="gmsg" id="dlyMsg"></span>`:""}
  </div>`;
}
const ACT_KINDS=["店舗","電脳","刈り取り","卸メーカー","納品","解除","その他"];
function actsParse(str){ const o={}; String(str||"").split(",").forEach(p=>{ const m=p.split(":"); if(m.length===2&&parseFloat(m[1])) o[m[0].trim()]=parseFloat(m[1]); }); return o; }
function actsFormat(o){ return ACT_KINDS.filter(k=>o[k]).map(k=>k+":"+o[k]).join(","); }
function actsShort(str){ const o=actsParse(str); return ACT_KINDS.filter(k=>o[k]).map(k=>k+o[k]).join(" "); }

/* ---- 日報モーダル ---- */
function openNippo(dsArg){
  const ds=dsArg||todayStr();
  const inp=k=>{const i=document.querySelector(`.dly[data-date="${ds}"][data-k="${k}"][data-kind="actual"]`); return i?i.value.trim():null;};
  const saved=((DAILYALL&&DAILYALL.rows)||[]).find(x=>String(x.uid)===String(me.sid)&&x.date===ds&&(x.kind||"actual")==="actual")||{};
  const pre=k=>{const v=inp(k); if(v!==null&&v!=="") return v; return saved[k]||"";};
  const acts=actsParse(saved.acts||"");
  const dParts=ds.split("-"); const dObj=new Date(+dParts[0],+dParts[1]-1,+dParts[2]);
  const WD=["日","月","火","水","木","金","土"];
  const ov=document.createElement("div"); ov.className="qovl"; ov.id="nippoOvl";
  const actRows=ACT_KINDS.map(k=>`<label style="display:inline-flex;align-items:center;gap:4px;margin:0 10px 8px 0">${k}
    <input class="ginput np-act" data-act="${k}" inputmode="decimal" style="width:52px;text-align:right;padding:4px 6px" value="${acts[k]||""}">h</label>`).join("");
  ov.innerHTML=`<div style="background:#fff;border-radius:14px;max-width:520px;width:100%;padding:20px 22px;margin-top:20px">
    <div style="font-weight:800;font-size:15px;margin-bottom:12px">📋 日報を作る　<input type="date" class="ginput" id="npDate" value="${ds}" style="padding:5px 8px;font-size:13px">　<span class="gpn">（${WD[dObj.getDay()]}）日付を変えると、その日の日報になります</span></div>
    <div class="gpn" style="margin-bottom:4px">今日やったこと（やった分だけ時間を入力。0.5h刻みOK）</div>
    <div style="margin-bottom:6px">${actRows}</div>
    <div id="npTenpoBlock" style="display:${(acts["店舗"]||pre("memo"))?"block":"none"};background:#f6f7f9;border-radius:10px;padding:10px 12px;margin-bottom:10px">
      <div class="gpn" style="margin-bottom:4px">回った店舗（スペース区切り）</div>
      <input class="ginput" id="npMemo" style="width:100%;padding:6px 8px" value="${escH(pre("memo"))}" placeholder="ベスト ヤマダ ナフコ">
      <div class="gpn" style="margin:8px 0 4px">検索数</div>
      <input class="ginput" id="npSearch" inputmode="numeric" style="width:110px;text-align:right;padding:6px 8px" value="${pre("searches")}">件
    </div>
    <div style="margin-bottom:10px">仕入金額 <input class="ginput" id="npCost" inputmode="numeric" style="width:110px;text-align:right;padding:6px 8px" value="${pre("cost")}">円
    　見込利益 <input class="ginput" id="npMikomi" inputmode="numeric" style="width:110px;text-align:right;padding:6px 8px" value="${pre("mikomi")}">円
    <div class="gpn">せどプレ取り込み済みなら自動で入っています</div></div>
    <div class="gpn" style="margin-bottom:4px">一言コメント</div>
    <input class="ginput" id="npComment" style="width:100%;padding:6px 8px;margin-bottom:14px" value="${escH(saved.comment||"")}" placeholder="初のレジ落ちゲット！など">
    <div style="display:flex;gap:8px">
      <button class="gbtn" id="npGo" style="background:#2563eb">保存してコピー</button>
      <button class="gbtn" id="npCancel" style="background:#9aa3af">閉じる</button>
      <span class="gmsg" id="npMsg"></span>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  document.getElementById("npCancel").onclick=()=>ov.remove();
  document.getElementById("npDate").onchange=e=>{ const v=e.target.value; if(v){ ov.remove(); openNippo(v); } };
  // 店舗の時間を入れたら店舗ブロックを表示
  ov.querySelectorAll(".np-act").forEach(i=>i.oninput=()=>{
    const tenpo=parseFloat(ov.querySelector('.np-act[data-act="店舗"]').value)||0;
    if(tenpo>0) document.getElementById("npTenpoBlock").style.display="block";
  });
  document.getElementById("npGo").onclick=async()=>{
    const btn=document.getElementById("npGo"), msg=document.getElementById("npMsg");
    const n=x=>{const f=parseFloat(String(x||"").replace(/,/g,""));return isNaN(f)?0:f;};
    const o={}; ov.querySelectorAll(".np-act").forEach(i=>{ const v=n(i.value); if(v) o[i.dataset.act]=v; });
    const totalH=Math.round(Object.values(o).reduce((a,b)=>a+b,0)*10)/10;
    const memo=document.getElementById("npMemo").value.trim();
    const tenpoCnt=memo?memo.split(/[\s、,\/]+/).filter(Boolean).length:0;
    const row={date:ds,kind:"actual",
      cost:n(document.getElementById("npCost").value), mikomi:n(document.getElementById("npMikomi").value),
      hours:totalH||n(pre("hours")), visits:tenpoCnt||n(pre("visits")), searches:n(document.getElementById("npSearch").value),
      memo:memo, acts:actsFormat(o), comment:document.getElementById("npComment").value.trim()};
    // 今月累計（保存済みの今日以外＋今日の値）
    const ymPre=ds.slice(0,7); let cm=0;
    ((DAILYALL&&DAILYALL.rows)||[]).forEach(r=>{ if(String(r.uid)===String(me.sid)&&(r.kind||"actual")==="actual"&&r.date.indexOf(ymPre)===0&&r.date!==ds&&r.date<=ds) cm+=r.mikomi||0; });
    cm+=row.mikomi;
    const goal=((DAILYALL&&DAILYALL.goals)||[]).find(g=>String(g.uid)===String(me.sid)&&g.ym===ymNow())||{};
    const gm=n(goal.gmikomi);
    const lines=[`【日報】${+dParts[1]}/${+dParts[2]}（${WD[dObj.getDay()]}）${me.name}`];
    const actStr=ACT_KINDS.filter(k=>o[k]).map(k=>`${k} ${o[k]}h`).join("・");
    if(actStr) lines.push(`やったこと：${actStr}（計 ${totalH}h）`);
    if(o["店舗"]||memo){
      if(memo) lines.push(`回った店舗（${tenpoCnt}店）：${memo}`);
      if(row.searches) lines.push(`検索数：${yen(row.searches)}件`);
    }
    lines.push(`仕入 ${yen(row.cost)}円／見込利益 ${yen(row.mikomi)}円`);
    if(row.comment) lines.push(`一言：${row.comment}`);
    lines.push(`今月累計：見込利益 ${yen(cm)}円`+(gm?`（目標${yen(gm)}円・${(cm/gm*100).toFixed(0)}%）`:""));
    const t=lines.join("\n");
    btn.disabled=true; msg.textContent="保存中…";
    try{
      const dres=await (await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"dysave",pass:PASS,uid:me.sid,name:me.name,rows:[row]})})).json();
      if(!(dres&&dres.ok)) throw new Error(dres&&dres.error||"保存失敗");
      try{ await navigator.clipboard.writeText(t); }
      catch(e){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
      ov.remove(); DAILYALL=null; await renderNums();
      showToast("📋 日報を保存してコピーしました。LINEに貼り付けてください");
    }catch(e){ msg.textContent="失敗："+e.message; btn.disabled=false; }
  };
}

function bindDaily(){
  const sel=document.getElementById("dailyWho");
  if(sel) sel.onchange=()=>{ numsWho=sel.value; renderNums(); };

  const applyDailyItems=window.__applyDaily=async(items,msgEl)=>{
    if(dlyMode!=="actual"){ dlyMode="actual"; const w=document.getElementById("dailyWrap"); if(w){ w.innerHTML=dailySectionHtml(String(me.sid),true); bindDaily(); } }
    const msg=msgEl||document.getElementById("uniMsg")||document.getElementById("dlyPasteMsg");
    if(!items.length){ if(msg) msg.textContent="せどプレのデータが読み取れませんでした"; return; }
    const byDt={}; let noDt=0;
    items.forEach(x=>{ if(!x.dt){noDt++;return;} const o=byDt[x.dt]=byDt[x.dt]||{cost:0,mikomi:0,n:0}; o.cost+=(x.cost||0)*(x.qty||1); o.mikomi+=(x.profit||0)*(x.qty||1); o.n++; });
    let hit=0, kept=0;
    const curRows=[]; // 表示中の月の保存行（充填時に確定）
    const exOf=ds=>((DAILYALL&&DAILYALL.rows)||[]).find(x=>String(x.uid)===String(me.sid)&&x.date===ds&&(x.kind||"actual")==="actual")||{};
    const otherByYm={}; // 表示中以外の月 → まとめて自動保存
    Object.keys(byDt).forEach(ds=>{
      const ci=document.querySelector(`.dly[data-date="${ds}"][data-k="cost"]`);
      const mi=document.querySelector(`.dly[data-date="${ds}"][data-k="mikomi"]`);
      if(ci&&mi){
        // せどプレは過去分が消えて目減りするので、既存記録の方が大きい日は守る
        const exM=Math.max(parseFloat(mi.value.replace(/,/g,""))||0, exOf(ds).mikomi||0);
        if(exM>byDt[ds].mikomi){ kept++; return; } // 在庫反映でリストから消えた分の目減り防止（今日を含む全日）
        ci.value=byDt[ds].cost; mi.value=byDt[ds].mikomi; hit++;
        // 保存行はこの時点の値で確定（モーダル待ちの間に裏の再描画で入力欄が消えても安全）
        const gv=k=>{const i=document.querySelector(`.dly[data-date="${ds}"][data-k="${k}"]`); return i?i.value.trim():"";};
        const nv=x=>{const f=parseFloat(String(x).replace(/,/g,""));return isNaN(f)?0:f;};
        const ex=exOf(ds);
        curRows.push({date:ds,kind:"actual",cost:byDt[ds].cost,mikomi:byDt[ds].mikomi,
          hours:nv(gv("hours"))||ex.hours||0, visits:nv(gv("visits"))||ex.visits||0,
          searches:nv(gv("searches"))||ex.searches||0, memo:gv("memo")||ex.memo||""});
      }
      else{
        const m=ds.match(/^(\d{4})-(\d{2})/);
        if(m){ const ym=(+m[1])+"年"+(+m[2])+"月"; (otherByYm[ym]=otherByYm[ym]||[]).push({date:ds,cost:byDt[ds].cost,mikomi:byDt[ds].mikomi,hours:0,visits:0,searches:0}); }
      }
    });
    let otherNote="";
    const ymList=Object.keys(otherByYm).sort((a,b)=>ymSortKey(a)-ymSortKey(b));
    if(ymList.length){
      // 月ごとに保存するかチェックボックスで選択（古い月だけ外す等ができる）
      const selYms=await new Promise(res=>{
        const ov=document.createElement("div"); ov.className="qovl";
        ov.innerHTML=`<div style="background:#fff;border-radius:14px;max-width:420px;width:100%;padding:18px 20px;margin-top:30px">
          <div style="font-weight:800;margin-bottom:6px">📥 表示中の月以外のデータがあります</div>
          <div class="gpn" style="margin-bottom:10px">保存したい月にチェック（仕入金額・見込利益として保存。時間・回訪・検索はその月を開いて入力）</div>
          <div style="display:flex;gap:8px;margin-bottom:8px">
            <button class="gbtn" id="omAll" style="padding:4px 12px;font-size:12px;background:#6b7686">全て選択</button>
            <button class="gbtn" id="omNone" style="padding:4px 12px;font-size:12px;background:#6b7686">全て外す</button>
          </div>
          <div style="max-height:260px;overflow-y:auto;margin-bottom:12px">
            ${ymList.map(ym=>`<label style="display:flex;align-items:center;gap:8px;padding:5px 2px;cursor:pointer"><input type="checkbox" class="omchk" value="${ym}" checked>${ym}（${otherByYm[ym].length}日分）</label>`).join("")}
          </div>
          <div style="display:flex;gap:8px">
            <button class="gbtn" id="omGo" style="background:#2563eb">チェックした月を保存</button>
            <button class="gbtn" id="omSkip" style="background:#9aa3af">保存しない</button>
          </div></div>`;
        document.body.appendChild(ov);
        ov.querySelector("#omAll").onclick=()=>ov.querySelectorAll(".omchk").forEach(c=>c.checked=true);
        ov.querySelector("#omNone").onclick=()=>ov.querySelectorAll(".omchk").forEach(c=>c.checked=false);
        ov.querySelector("#omGo").onclick=()=>{ const v=[...ov.querySelectorAll(".omchk:checked")].map(c=>c.value); ov.remove(); res(v); };
        ov.querySelector("#omSkip").onclick=()=>{ ov.remove(); res([]); };
        ov.onclick=e=>{ if(e.target===ov){ ov.remove(); res([]); } };
      });
      const desc=selYms.map(ym=>`${ym}:${otherByYm[ym].length}日分`).join("、");
      const skipped=ymList.filter(y=>selYms.indexOf(y)<0);
      if(selYms.length){
        msg.textContent="他の月を保存中…";
        for(const ym of selYms){
          // 既存の時間・回訪・検索を消さないよう既存行とマージ
          const rows=otherByYm[ym].map(r=>{
            const ex=((DAILYALL&&DAILYALL.rows)||[]).find(x=>String(x.uid)===String(me.sid)&&x.date===r.date&&(x.kind||"actual")==="actual")||{};
            if((ex.mikomi||0)>r.mikomi){ kept++; return null; } // 既存記録の方が大きい過去日は守る
            return {date:r.date,kind:"actual",cost:r.cost,mikomi:r.mikomi,hours:ex.hours||0,visits:ex.visits||0,searches:ex.searches||0};
          }).filter(Boolean);
          if(!rows.length) continue;
          try{
            await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"dysave",pass:PASS,uid:me.sid,name:me.name,rows:rows})});
            rows.forEach(r=>{ // ローカルにも反映
              const arr=(DAILYALL.rows=DAILYALL.rows||[]);
              const i=arr.findIndex(x=>String(x.uid)===String(me.sid)&&x.date===r.date);
              const rec=Object.assign({uid:String(me.sid),name:me.name},r);
              if(i>=0) arr[i]=rec; else arr.push(rec);
            });
          }catch(e){}
        }
        otherNote=`・他の月（${desc}）は自動保存済み${skipped.length?`・${skipped.join("、")}はスキップ`:""}`;
        showToast("✅ 選んだ月の分も保存しました（"+selYms.length+"ヶ月）");
      }else{
        otherNote=`・他の月（${ymList.join("、")}）は保存せずスキップ`;
      }
    }
    // 表示中の月の分もそのまま自動保存（取り込み＝確定。保存し忘れ・リロード消失を防ぐ）
    let curSaved=0;
    if(curRows.length){
      if(msg) msg.textContent="この月の分を保存中…";
      try{
        const d=await (await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"dysave",pass:PASS,uid:me.sid,name:me.name,rows:curRows})})).json();
        if(d&&d.ok) curSaved=curRows.length;
      }catch(e){}
    }
    const summary=`${items.length}商品を${Object.keys(byDt).length}日分に振り分け（この月${hit}日分${curSaved?"を保存済み":"は保存失敗（もう一度取り込んでください）"}${kept?`・${kept}日分は既存記録の方が大きいため保持`:""}${otherNote}${noDt?`・仕入日不明${noDt}件`:""}）`;
    if(curSaved){
      DAILYALL=null; await renderNums();
      const m2=document.getElementById("uniMsg"); if(m2) m2.textContent=summary;
      showToast("✅ せどプレ取り込みを保存しました（この月"+curSaved+"日分）");
    } else if(msg) msg.textContent=summary;
  };

  document.querySelectorAll(".djun[data-juntgl]").forEach(tr=>{
    tr.onclick=()=>{
      const jn=tr.dataset.juntgl;
      const rows=document.querySelectorAll(`.dlytbl tr[data-jun="${jn}"]`);
      const open=rows.length&&rows[0].style.display==="none";
      rows.forEach(r=>{ r.style.display=open?"":"none"; });
      const a=tr.querySelector(".djarrow"); if(a) a.textContent=open?"▼":"▶";
    };

  const ft=document.getElementById("dlygFromTrend");

    <div class="ncsvrow" style="margin-top:14px"><span class="gpn">📥 一番上の「データ取り込み」に在庫CSV（FBA＋自己発送の2つまとめてOK）を入れると自動で合算・反映されます</span><span class="gmsg" id="nzaikoMsg"></span></div>

  </div>`;

  let memHas=[...new Set(((NUMSALL&&NUMSALL.nums)||[]).filter(n=>n.ym===numsMonth).map(n=>String(n.uid))
    .concat(((NUMSALL&&NUMSALL.metas)||[]).filter(m=>m.ym===numsMonth).map(m=>String(m.uid))))];
  memHas=memHas.filter(u=>u!=="0"); // のの（マスタ）は報告しないので一覧に出さない
  // 自分を先頭に（データが無くても自分の行は常に出す。ののは除く）
  if(String(me.sid)!=="0") memHas=[String(me.sid)].concat(memHas.filter(u=>u!==String(me.sid)));
  const memName=u=>{const m=ROSTER.find(x=>String(x.sid)===u); if(m) return m.name;
    const d=((NUMSALL&&NUMSALL.nums)||[]).concat((NUMSALL&&NUMSALL.metas)||[]).find(x=>String(x.uid)===String(u));
    return d&&d.name?d.name:u;};
  if(numsMode==="view") html+=`<div class="gpanel"><div class="gph">みんなの報告（${numsMonth}）</div>`+
    memHas.map((u,i)=>
      `<div class="nmem"><div class="nmemh" data-uid="${u}">▶ ${escH(memName(u))}${u===String(me.sid)?'<span class="gpn">（自分の報告）</span>':""}</div><div class="nrbody" style="display:none" data-body="${u}"></div></div>`).join("")+`</div>`;

  body.innerHTML=html;

  body.querySelectorAll(".tdrow").forEach(bindTdRow);
  body.querySelectorAll(".tdadd").forEach(b=>{
    b.onclick=()=>{ b.insertAdjacentHTML("beforebegin",tdRowHtml()); bindTdRow(b.previousElementSibling); };
  });
  const rt=document.getElementById("revToggle");
  if(rt) rt.onclick=()=>{ const b=document.getElementById("revBox"); const open=b.style.display==="none"; b.style.display=open?"":"none"; rt.textContent=(open?"▼":"▶")+" 修正目標（旬の途中で立て直す時だけ）"; };
  const rg=document.getElementById("tgRateGo");
  if(rg) rg.onclick=()=>{
    const rate=parseFloat(document.getElementById("tgRate").value);
    if(!rate||rate<=0||rate>=100){ alert("％を入力してください（例：15）"); return; }
    localStorage.setItem("nonocon_gprate",String(rate));
    let n=0;
    document.querySelectorAll('#trendBox .tgoal[data-k="gsales"]').forEach(i=>{
      const gs=parseFloat(i.value.replace(/,/g,""));
      const gp=document.querySelector(`.tgoal[data-ym="${i.dataset.ym}"][data-k="gprofit"]`);
      if(gs&&gp){ gp.value=Math.round(gs*rate/100); n++; }
    });
    showToast(n+"ヶ月分の目標月利を計算しました（まとめて保存を忘れずに）");
  };
  const tw=document.getElementById("trendWho");
  // メンバー切替時は手元のデータで即表示しつつ、裏で最新を取り直す（面談中でも最新が見えるように）
  const switchWho=v=>{ numsWho=v; NUMSALL=null; GOALS=null; DAILYALL=null; KGOALS=null; renderNums(); };
  if(tw) tw.onchange=()=>switchWho(tw.value);
  const ws=document.getElementById("numsWhoSel");
  if(ws) ws.onchange=()=>switchWho(ws.value);
  const tt=document.getElementById("trendToggle");
  if(tt) tt.onclick=()=>{ trendOpen=!trendOpen; renderNums(); };
  document.querySelectorAll(".modebtn").forEach(b=>{
    b.onclick=()=>{ if(numsMode===b.dataset.m) return; numsMode=b.dataset.m; if(numsMode==="view"&&!numsWho) numsWho=String(me.sid); renderNums(); };
  });
  bindTrendGoals();
  bindLifeGoal();
  bindDaily();
  bindKgoal();
  // 📥統一取り込み
  const uniHandleFiles=async files=>{
    const msg=document.getElementById("uniMsg");
    const zaikoFiles=[]; // 在庫CSVは複数まとめて合算するため先に仕分け
    for(const f of files){
      try{
        const buf=await f.arrayBuffer();
        let text="";
        try{ text=new TextDecoder("utf-8",{fatal:true}).decode(buf); }        // UTF-8として厳密に読めればそれが正
        catch(e){ text=new TextDecoder("shift_jis").decode(buf); }            // ダメならShift_JIS（せどプレDL等）
        const head=(text.split(/\r?\n/,1)[0]||"");
        // せどプレを最優先で判定（出品コメント定型文に「注文日」が含まれ誤判別するため、注文日はヘッダ行のみで判定）
        if(/(^|\n)"?\d{8}-\d+-[A-Z0-9]{10}-/.test(text)||(head.indexOf("SKU")>=0&&head.indexOf("粗利")>=0)){ await window.__applyDaily(sedopreParse(text),msg); }
        else if(head.indexOf("注文日")>=0){ await importPricetarFile(f,msg); }
        else if(/number|在庫数/.test(head)){ zaikoFiles.push(f); }
        else{ if(msg) msg.textContent=`「${f.name}」の種類を判別できませんでした（プライスター注文／せどプレ／在庫CSVに対応）`; }
      }catch(e){ if(msg) msg.textContent=`「${f.name}」：`+String(e).slice(0,120); }
    }
    if(zaikoFiles.length){ try{ await importZaikoFiles(zaikoFiles,msg); }catch(e){ if(msg) msg.textContent="在庫CSV："+String(e).slice(0,120); } }
  };
  const uniDrop=document.getElementById("uniDrop");
  if(uniDrop){
    uniDrop.onclick=()=>{
      const inp=document.createElement("input"); inp.type="file"; inp.accept=".csv,text/csv"; inp.multiple=true;
      inp.onchange=()=>uniHandleFiles([...inp.files]);
      inp.click();
    };
    uniDrop.ondragover=e=>{ e.preventDefault(); uniDrop.classList.add("drop-on"); };
    uniDrop.ondragleave=()=>uniDrop.classList.remove("drop-on");
    uniDrop.ondrop=e=>{ e.preventDefault(); uniDrop.classList.remove("drop-on"); uniHandleFiles([...e.dataTransfer.files]); };
    const upg=document.getElementById("uniPasteGo");
    if(upg) upg.onclick=()=>window.__applyDaily(sedoprePasteParse(document.getElementById("uniPaste").value),document.getElementById("uniMsg"));
  }
  document.getElementById("nprev0").onclick=()=>{numsMonth=ymShift(numsMonth,-1);numsParsed=null;numsDraft=null;renderNums();};
  document.getElementById("nnext0").onclick=()=>{numsMonth=ymShift(numsMonth,1);numsParsed=null;numsDraft=null;renderNums();};

  const importPricetarFile=async(f,msg)=>{
    if(msg) msg.textContent="プライスター注文CSVを解析中…";
    captureNumsDraft(); // 入力中の値が再描画で消えないように退避
    const byMonth=await parsePricetar(f);
    const skipped=byMonth.__skipped||0; delete byMonth.__skipped;
    const months=Object.keys(byMonth);
    let target=numsMonth;
    if(!byMonth[target]){
      if(months.length===1){ target=months[0]; numsMonth=target; numsDraft=null; }
      else{ if(msg) msg.textContent=`選択中の${numsMonth}のデータがCSVにありません（含まれる月：${months.join("、")}）`; return; }
    }
    numsParsed=byMonth[target];
    await renderNums();
    const m2=document.getElementById("uniMsg")||document.getElementById("ncsvMsg");
    if(m2) m2.textContent=`プライスター注文CSVを②に取り込みました${skipped?`（キャンセル・保留中の${skipped}件を除外）`:""}。下の保存ボタンで確定`;
  };
  const importZaikoFiles=async(files,msg)=>{
    let cnt=0,sales=0,cost=0,hasPrice=false,hasCost=false;
    for(const f of files){
      const z=await parseZaiko(f);
      cnt+=z.cnt; sales+=z.sales; cost+=z.cost;
      hasPrice=hasPrice||z.hasPrice; hasCost=hasCost||z.hasCost;
    }
    const el=id=>document.getElementById(id);
    if(el("n_stockCnt")) el("n_stockCnt").value=cnt;
    if(hasPrice&&el("n_stockSales")) el("n_stockSales").value=sales;
    if(hasCost&&el("n_stockCost")) el("n_stockCost").value=cost;
    if(msg) msg.textContent=`在庫CSVを③に反映：在庫${yen(cnt)}個`+(hasPrice?` / 販売額${yen(sales)}円`:"")+(hasCost?` / 仕入額${yen(cost)}円`:"")+"（下の保存ボタンで確定）";
  };
  const ncsvB=document.getElementById("ncsvBtn");
  if(ncsvB) ncsvB.onclick=()=>{
    const inp=document.createElement("input"); inp.type="file"; inp.accept=".csv,text/csv";
    inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return;
      try{ await importPricetarFile(f,document.getElementById("ncsvMsg")); }catch(e){ const m=document.getElementById("ncsvMsg"); if(m) m.textContent=String(e); } };
    inp.click();
  };

  /* 保存は1本化：目標・振り返り・（取り込み済みなら）CSVの数字をまとめて保存 */
  const saveAll=async(btn,msg)=>{
    const label=btn.textContent;
    btn.disabled=true; btn.textContent="保存中…"; if(msg) msg.textContent="";
    const g=(id,key)=>{const el=document.getElementById(id);if(el)return el.value.trim();return key?String(meta[key]==null?"":meta[key]):"";};
    try{
      if(numsParsed){
        const rows=JUNS.map(j=>({jun:j,sales:Math.round(numsParsed[j].sales),profit:Math.round(numsParsed[j].profit),cnt:numsParsed[j].cnt}));
        const r1=await (await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},
          body:JSON.stringify({action:"nnum",pass:PASS,uid:me.sid,name:me.name,ym:numsMonth,rows:rows})})).json();
        if(!r1||!r1.ok) throw (r1&&r1.error)||"数字の保存に失敗";
      }
      const bodyData={action:"nsave",pass:PASS,uid:me.sid,name:me.name,ym:numsMonth,gradMonth:"",gradGoal:""};
      NKEYS.forEach(k=>{ bodyData[k]=g("n_"+k,k); });
      TODO_SECS.forEach(x=>{ bodyData[x[0]]=JSON.stringify(collectTodos(x[0])||[]); bodyData[x[2]]=""; });
      const r2=await (await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(bodyData)})).json();
      if(!r2||!r2.ok) throw (r2&&r2.error)||"入力内容の保存に失敗";
      NUMSALL=null; numsParsed=null; numsDraft=null;
      await renderNums();
      const m2=document.getElementById("nmetaMsg"); if(m2) m2.textContent="✅ 保存しました";
      return;
    }catch(e){
      if(msg) msg.textContent="保存に失敗しました："+String(e);
      else alert("保存に失敗しました："+String(e));
    }
    btn.disabled=false; btn.textContent=label;
  };

  const saveBtn=document.getElementById("nnumSave");
  if(saveBtn) saveBtn.onclick=()=>saveAll(saveBtn,document.getElementById("ncsvMsg"));

  const nzB=document.getElementById("nzaikoBtn");
  if(nzB) nzB.onclick=()=>{
    const inp=document.createElement("input"); inp.type="file"; inp.accept=".csv,text/csv"; inp.multiple=true;
    inp.onchange=async()=>{
      const files=[...inp.files]; if(!files.length) return;
      const msg=document.getElementById("nzaikoMsg"); msg.textContent="解析中…";
      try{ await importZaikoFiles(files,msg);
      }catch(e){ msg.textContent=String(e); }
    };
    inp.click();
  };
  const metaBtn=document.getElementById("nmetaSave");
  if(metaBtn) metaBtn.onclick=()=>saveAll(metaBtn,document.getElementById("nmetaMsg"));

  body.querySelectorAll(".nmemh").forEach(h=>{
    h.onclick=()=>{
      const el=body.querySelector(`div.nrbody[data-body="${h.dataset.uid}"]`);
      const open=el.style.display!=="none";
      el.style.display=open?"none":"";
      h.innerHTML=(open?"▶ ":"▼ ")+h.innerHTML.slice(2);
      if(!open) el.innerHTML=numsReportHtml(h.dataset.uid,numsMonth);
    };
  });
}

let GOALS=null, GOALS_LOADING=false, goalPanelOpen=null; // null=自動（未入力なら開く）
function loadGoals(){
  if(GOALS_LOADING) return; GOALS_LOADING=true;
  jsonp({action:"gall"}).then(d=>{
    GOALS={}; (d.goals||[]).forEach(g=>{ (GOALS[g.uid]=GOALS[g.uid]||[]).push(g); });
    if(chap===MEMBERS) renderMembers();
  }).catch(()=>{ GOALS={}; });
}
const escH=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function renderMembers(){
  const body=document.getElementById("body"); body.innerHTML="";
  if(!ROSTER.length){
    body.innerHTML='<div style="text-align:center;color:#6b7686;padding:40px">メンバー情報を読み込み中…</div>';
    return;
  }
  if(GOALS===null) loadGoals();
  // 生年月日未記入だと年齢がシート数式で126等になるため、ありえない値は非表示
  const ageOk=a=>{const n=parseInt(a,10);return(!isNaN(n)&&n>=10&&n<=100)?String(n):"";};
  const myLog=(GOALS&&me&&GOALS[me.sid])||[];
  const mine=myLog.length?myLog[myLog.length-1]:{num:"",after:""};
  let html="";
  if(me){
    const gOpen = goalPanelOpen!==null ? goalPanelOpen : !(mine.num||mine.after);
    html+=`<div class="gpanel"><div class="gph gtoggle" id="gphToggle"><span class="caret">${gOpen?"▼":"▶"}</span> 🎯 あなたの目標を入力 <span class="gpn">（メンバー全員に表示・月ごとにログが残ります）</span></div>
      <div id="gbody" style="${gOpen?"":"display:none"}">
      <label class="glbl">卒業までに達成したい数字</label>
      <input class="ginput" id="gnum" placeholder="例：月利50万円" value="${escH(mine.num)}">
      <label class="glbl">卒業した後にどんな事をやっていきたいか<span class="gpn">（今の段階で構いません／物販でも物販以外でも）</span></label>
      <textarea class="ginput" id="gafter" rows="2" placeholder="例：卸メーカー仕入れに挑戦しながら情報発信もやりたい">${escH(mine.after)}</textarea>
      <div><button class="gbtn" id="gsaveBtn">保存する</button><span class="gmsg" id="gmsg"></span></div>
      </div></div>`;
  }
  html+='<div class="apanel mpanel"><table><thead><tr>'+
    '<th>名前</th><th>エリア</th><th>年齢</th><th>誕生日</th><th>入会</th><th>専業/副業</th></tr></thead><tbody>';
  const sorted=[...ROSTER].sort((a,b)=>{
    const na=parseInt(a.sid,10), nb=parseInt(b.sid,10);
    if(isNaN(na)&&isNaN(nb))return 0;
    if(isNaN(na))return 1;
    if(isNaN(nb))return -1;
    return na-nb;
  });
  sorted.forEach((m,i)=>{
    const gcls=(m.gender||"").indexOf("男")>=0?"male":((m.gender||"").indexOf("女")>=0?"female":"");
    const isNono=m.sid==="0"||m.name.replace(/[\s　]+/g,"")==="野々脇雅史";
    const badge=isNono?'<span class="mbadge">マスタ</span>':(m.grad?'<span class="mbadge">卒業生・講師</span>':"");
    const glog=(GOALS&&GOALS[m.sid])||[];
    const hasDetail=!!(m.hobby||m.mbti||glog.length);
    html+=`<tr class="${gcls}${hasDetail?" mexp":""}" data-mi="${i}"><td class="pname">${m.name.replace(/^-/,"")}${badge}${hasDetail?'<span class="mmore">▸</span>':""}<div class="mkana">${m.kana||""}</div></td>`+
      `<td>${m.area||"—"}</td>`+
      `<td>${ageOk(m.age)||"—"}</td>`+
      `<td>${m.bday||"—"}</td>`+
      `<td>${fmtCohortJoinHtml(m)}</td>`+
      `<td>${m.work||"—"}</td></tr>`;
    if(hasDetail){
      html+=`<tr class="mdetail ${gcls}" data-md="${i}" style="display:none"><td colspan="6">`+
        (m.hobby?`<div><span class="mdl">趣味・特技</span>${escH(m.hobby)}</div>`:"")+
        (m.mbti?`<div><span class="mdl">タイプ別診断</span>${escH(m.mbti)}</div>`:"")+
        glog.slice().reverse().map(g=>
          `<div class="ghist"><span class="mdl">目標（${escH(g.ym)}）</span>`+
          (g.num?`<div class="gline">🎯 卒業までの数字：${escH(g.num)}</div>`:"")+
          (g.after?`<div class="gline">🚀 卒業後やりたい事：${escH(g.after)}</div>`:"")+
          `</div>`).join("")+
        `</td></tr>`;
    }
  });
  html+='</tbody></table></div>';
  body.innerHTML=html;
  const gt=document.getElementById("gphToggle");
  if(gt){
    gt.onclick=()=>{
      const gb=document.getElementById("gbody");
      const open=gb.style.display!=="none";
      goalPanelOpen=!open;
      gb.style.display=open?"none":"";
      gt.querySelector(".caret").textContent=open?"▶":"▼";
    };
  }
  const btn=document.getElementById("gsaveBtn");
  if(btn){
    btn.onclick=()=>{
      const num=document.getElementById("gnum").value.trim();
      const after=document.getElementById("gafter").value.trim();
      const msg=document.getElementById("gmsg");
      msg.textContent="保存中…";
      jsonp({action:"gsave",uid:me.sid,name:me.name,num:num,after:after}).then(d=>{
        if(d&&d.ok){
          if(!GOALS)GOALS={};
          const arr=GOALS[me.sid]=GOALS[me.sid]||[];
          const e=arr.find(x=>x.ym===d.ym);
          if(e){ e.num=num; e.after=after; } else arr.push({uid:me.sid,ym:d.ym,num:num,after:after});
          msg.textContent="✅ 保存しました（"+d.ym+"のログとして記録）";
          setTimeout(()=>{renderMembers();},900);
        }
        else msg.textContent="保存に失敗しました";
      }).catch(()=>{ msg.textContent="通信エラー"; });
    };
  }
  body.querySelectorAll("tr.mexp").forEach(tr=>{
    tr.style.cursor="pointer";
    tr.onclick=()=>{
      const d=body.querySelector(`tr.mdetail[data-md="${tr.dataset.mi}"]`);
      const open=d.style.display!=="none";
      d.style.display=open?"none":"";
      const car=tr.querySelector(".mmore"); if(car)car.textContent=open?"▸":"▾";
    };
  });
}

/* ---------- みんなの進捗（全員が見られる） ---------- */
async function renderEveryone(){
  const body=document.getElementById("body");
  body.innerHTML='<div style="text-align:center;color:#6b7686;padding:40px">読み込み中…</div>';
  try{
    await loadRoster();
    if(!pallCache){ const r=await jsonp({action:"pall"}); if(r&&r.error) throw r.error; pallCache=r; }
  }catch(e){ body.innerHTML='<div style="text-align:center;color:#6b7686;padding:40px">読み込みに失敗しました</div>'; return; }
  if(chap!==PALL) return;
  const prog={}, last={};
  (pallCache.rows||[]).forEach(r=>{
    if(!prog[r.uid])prog[r.uid]={};
    prog[r.uid][r.step]=r.checked;
    if(r.checked&&r.updated){const t=new Date(r.updated); if(!last[r.uid]||t>last[r.uid])last[r.uid]=t;}
  });
  const isStd=st=>st.cohort&&st.cohort.indexOf("WS")===0&&st.cohort.indexOf("FS")<0;
  const roster=ROSTER.filter(st=>!st.grad&&st.name.replace(/[\s　]+/g,"")!=="野々脇雅史")
    .slice().sort((a,b)=>{
      const na=parseInt(a.sid,10),nb=parseInt(b.sid,10);
      if(isNaN(na)&&isNaN(nb))return 0;
      if(isNaN(na))return 1;
      if(isNaN(nb))return -1;
      return na-nb;
    });
  let html='<button class="abtn" id="preload">🔄 最新に更新</button>'+
    '<div class="apanel mpanel"><table><thead><tr><th>受講生</th><th>入会</th>'+
    A_CHAPTERS.map(c=>`<th>${c.ch}</th>`).join("")+
    '<th>進捗</th><th>最終更新</th></tr></thead><tbody>';
  roster.forEach(st=>{
    const p=prog[st.sid]||{};
    const std=isStd(st);
    const per=A_CHAPTERS.map(c=>{
      if(std&&c.ch==="卸メーカー")return null;
      return {done:c.steps.filter(([id])=>p[id]).length,total:c.steps.length};
    });
    const done=per.reduce((a,x)=>a+(x?x.done:0),0);
    const total=per.reduce((a,x)=>a+(x?x.total:0),0);
    const pct=total?Math.round(done/total*100):0;
    const lu=last[st.sid];
    html+=`<tr><td class="pname"><span style="color:#9aa3af;font-weight:400;margin-right:6px">${isNaN(parseInt(st.sid,10))?"":st.sid}</span>${st.name.replace(/^-/,"")}</td>`+
      `<td>${fmtCohortJoinHtml(st)}</td>`+
      per.map(x=>x?`<td>${x.done}/${x.total}</td>`:`<td style="color:#c2c8d0">—</td>`).join("")+
      `<td><span class="abar"><i style="width:${pct}%"></i></span><span class="apct">${pct}%</span></td>`+
      `<td>${lu?`${lu.getMonth()+1}/${lu.getDate()}`:"—"}</td></tr>`;
  });
  html+='</tbody></table></div><div class="ahint">みんなで進捗を見せ合って、切磋琢磨しましょう💪</div>';
  body.innerHTML=html;
  document.getElementById("preload").onclick=()=>{pallCache=null;renderEveryone();};
}

/* ---------- 管理：ステップ別の完了状況 ---------- */
function renderStepView(){
  const box=document.getElementById("stepResult");
  if(!box||!adminCache) return;

  const chipCls=st=>st==="制限なし"?"kc-ok":(st==="要承認"?"kc-warn":(String(st).indexOf("申請中")>=0?"kc-pend":(String(st).indexOf("解除")>=0?"kc-blue":"")));

  const mems=[...ROSTER].filter(m=>String(m.sid)!==String(me.sid)).sort((a,b)=>{
    const na=parseInt(a.sid,10), nb=parseInt(b.sid,10);

    const s0=sei(m.name);

  BRANDS.forEach(b=>{
    const st=kaijoState[b.brand]||"未確認";

    const brandEsc=b.brand.replace(/"/g,"&quot;");

    const myPdf=kaijoPdf[b.brand]?` <a class="kpdflink" href="${kaijoPdf[b.brand]}" target="_blank" rel="noopener">📄</a>`:"";
    const cells=mems.map(m=>{

      const stx=r&&r.status&&r.status!=="未確認"?r.status:"";
      const pdf=r&&r.pdf?` <a href="${r.pdf}" target="_blank" rel="noopener" title="解除PDFを見る">📄</a>`:"";

        fr.onload=async()=>{
          const b64=String(fr.result).split(",")[1];
          try{
            const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},
              body:JSON.stringify({action:"kpdf",pass:PASS,uid:me.sid,name:me.name,brand:brand,filename:f.name,data:b64})});
            const d=await res.json();
            if(d&&d.ok){
              kaijoPdf[brand]=d.url;
              ALLKAIJO=null; // 次回表示時に再取得
              fillKaijo();
              return;
            }
            alert("アップロードに失敗しました："+(d&&d.error||"不明なエラー"));
          }catch(e){ alert("アップロードに失敗しました。通信環境を確認してください"); }
          btn.textContent="＋PDF添付"; btn.disabled=false;
        };
        fr.readAsDataURL(f);
      };
      inp.click();
