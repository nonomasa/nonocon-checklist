  .ilink{flex:none;align-self:center;font-size:12px;font-weight:700;color:var(--accent);

/* ---------- スプシ通信（JSONPでCORS回避） ---------- */
function jsonp(params){
  return new Promise((resolve,reject)=>{
    if(!API_URL){ reject("no-api"); return; }
    const cb = "cb_"+Date.now()+"_"+Math.floor(Math.random()*1e6);
    const s = document.createElement("script");
    const cleanup = ()=>{ delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s); };
    window[cb] = (data)=>{ resolve(data); cleanup(); };
    s.onerror = ()=>{ reject("net"); cleanup(); };
    const q = Object.entries(Object.assign({pass:PASS},params,{callback:cb}))
      .map(([k,v])=>encodeURIComponent(k)+"="+encodeURIComponent(v)).join("&");
    s.src = API_URL+"?"+q;
    document.body.appendChild(s);
  });
}

/* 入会表記：WS期生のFSコースは青文字で強調 */
function fmtCohortJoinHtml(m){
  const t = fmtCohortJoin(m);
  const isFS = (m.cohort||"").indexOf("WS")===0 && (m.cohort||"").indexOf("FS")>=0;
  return isFS ? `<span style="color:#2563eb;font-weight:700">${t}</span>` : t;
}

/* 入会年度＋入会年月の合体表記（例：ののコン2024（2025年1月））。「23年9月」→「2023年9月」に補完 */
function fmtCohortJoin(m){
  const jm = String(m.join||"").match(/^(\d{2})年(\d{1,2})月/);
  const jf = jm ? `20${jm[1]}年${jm[2]}月` : String(m.join||"").replace(/-$/,"");
  if(m.cohort && jf) return `${m.cohort}（${jf}）`;
  return m.cohort || jf || "—";
}

function showPassGate(el){
  el.innerHTML = '🔑 合言葉を入力してください：' +
    '<input id="pw" type="password" placeholder="合言葉" style="padding:7px 10px;border-radius:8px;border:1px solid #3a4653;background:#0e1620;color:#fff;font-size:13px">' +
    '<button id="pwgo">OK</button>' +
    '<span id="pwerr" class="warn" style="display:none">合言葉が違います</span>';
  const go = async ()=>{
    const v = document.getElementById("pw").value.trim();
    if(!v) return;
    PASS = v;
    const btn = document.getElementById("pwgo");
    btn.disabled = true;
    btn.textContent = "確認中…";
    document.getElementById("pwerr").style.display = "none";
    try{
      const r = await jsonp({action:"roster"});
      if(r && r.error) throw r.error;
      ROSTER = r.students||[];
      localStorage.setItem(PASS_KEY, PASS);
      initIdent();
    }catch(e){
      PASS = "";
      btn.disabled = false;
      btn.textContent = "OK";
      document.getElementById("pwerr").style.display = "";
    }
  };
  document.getElementById("pwgo").onclick = go;
  document.getElementById("pw").addEventListener("keydown", ev=>{ if(ev.key==="Enter") go(); });
  document.getElementById("pw").focus();
}

    el.innerHTML = `<span class="who">👤 ${me.name} さん</span><button id="switch">別の人に切り替え</button>`;
    document.getElementById("switch").onclick=()=>{ localStorage.removeItem("nonocon_me"); me=null; initIdent(); };
    loadProgress();

    return;
  }
  el.innerHTML = 'お名前を選んでください：<select id="who"><option>読み込み中…</option></select>';

    await loadRoster();

      ROSTER.map(s=>`<option value="${s.sid}" data-name="${s.name}">${s.name}</option>`).join("");

      me={sid:o.value, name:o.dataset.name};
      localStorage.setItem("nonocon_me", JSON.stringify(me));
      initIdent();
    };
  }catch(e){
    if(String(e).indexOf("unauthorized") >= 0){
      localStorage.removeItem(PASS_KEY); PASS = "";
      showPassGate(el); return;
    }
    el.innerHTML = '<span class="warn">名簿の読み込みに失敗。通信環境を確認してください。</span>';
    loadCache(); render();
  }
}

  const roster = (adminCache.roster||[]).filter(st=>!st.grad && st.name.replace(/[\s　]+/g,"")!=="野々脇雅史"); // 卒業（在籍）と、のの本人は管理対象外
  const prog={}, last={};
  (adminCache.rows||[]).forEach(r=>{
    if(!prog[r.uid]) prog[r.uid]={};
    prog[r.uid][r.step]=r.checked;
    if(r.checked && r.updated){
      const t=new Date(r.updated);
      if(!last[r.uid] || t>last[r.uid]) last[r.uid]=t;
    }
  });
  const now=new Date();
  const isStd = st => st.cohort && st.cohort.indexOf("WS")===0 && st.cohort.indexOf("FS")<0;
  const rows = roster.map(s=>{
    const p=prog[s.sid]||{};
    const std=isStd(s);
    const per=A_CHAPTERS.map(c=>{
      if(std && c.ch==="卸メーカー") return null; // STは対象外
      return {done:c.steps.filter(([id])=>p[id]).length, total:c.steps.length};
    });
    const done=per.reduce((a,x)=>a+(x?x.done:0),0);
    const total=per.reduce((a,x)=>a+(x?x.total:0),0);
    const lu=last[s.sid];
    const days=lu?Math.floor((now-lu)/86400000):null;
    return {s,p,per,done,pct:total?Math.round(done/total*100):0,lu,days};
  }).sort((a,b)=>{

/* その旬が終わっているか（今日基準）。終わっていない旬は数字が半端なので表示しない */
function junDone(ym,jun){
  const m=String(ym).match(/(\d+)年(\d+)月/); if(!m) return true;
  const y=+m[1], mo=+m[2];
  const now=new Date(), cy=now.getFullYear(), cm=now.getMonth()+1, cd=now.getDate();
  if(y<cy||(y===cy&&mo<cm)) return true;   // 過去の月＝全旬確定
  if(y>cy||(y===cy&&mo>cm)) return false;  // 未来の月
  const last=new Date(y,mo,0).getDate();
  const end={"上旬":10,"中旬":20,"下旬":last}[jun];
  return cd>end;
}
function junWaitLabel(ym,jun){
  const m=String(ym).match(/(\d+)年(\d+)月/);
  const now=new Date(), cd=now.getDate();
  const start={"上旬":1,"中旬":11,"下旬":21}[jun];
  if(m && +m[2]===now.getMonth()+1 && +m[1]===now.getFullYear() && cd>=start) return "進行中（旬の終了後に集計）";
  return "—";
}
function ymShift(ym,delta){const m=ym.match(/(\d+)年(\d+)月/);let y=+m[1],mo=+m[2]+delta;
  while(mo<1){mo+=12;y--;}while(mo>12){mo-=12;y++;}return y+"年"+mo+"月";}

/* RFC4180風の簡易CSVパーサ（引用符内のカンマ・改行対応） */
function parseCSV(text){
  const rows=[];let row=[],cell="",inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else inQ=false; }
      else cell+=c;
    }else{
      if(c==='"') inQ=true;
      else if(c===','){row.push(cell);cell="";}
      else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell="";}
      else if(c!=='\r') cell+=c;
    }
  }
  if(cell!==""||row.length){row.push(cell);rows.push(row);}
  return rows;
}

async function parsePricetar(file){
  const buf=await file.arrayBuffer();
  let text="";
  try{ text=new TextDecoder("shift_jis").decode(buf); }catch(e){}
  if(text.indexOf("注文日")<0){ text=new TextDecoder("utf-8").decode(buf); }
  if(text.indexOf("注文日")<0) throw "プライスターの注文CSVではないようです（「注文日」列が見つかりません）";
  const rows=parseCSV(text);
  const head=rows[0];
  const ci={date:head.indexOf("注文日"),unit:head.indexOf("単価"),qty:head.indexOf("売れた個数"),
    profit:head.indexOf("粗利益"),status:head.indexOf("出荷状態")};
  if(ci.date<0||ci.unit<0||ci.qty<0||ci.profit<0) throw "必要な列（注文日・単価・売れた個数・粗利益）が見つかりません";
  const num=x=>{const v=parseFloat(String(x).replace(/,/g,""));return isNaN(v)?0:v;};
  const byMonth={};
  let skipped=0;
  for(let r=1;r<rows.length;r++){
    const raw=rows[r][ci.date]; if(!raw) continue;
    /* 集計から外す行（プライスターの売上分析と同じ扱い）
       ・キャンセル＝売れていない
       ・保留中(Pending)＝金額未確定。単価0で原価だけ計上され粗利が大きくマイナスになる
         → 出荷されれば次回の取り込みでShippedとして正しく計上される */
    if(ci.status>=0){
      const st=String(rows[r][ci.status]||"").toLowerCase();
      if(st.indexOf("cancel")>=0||st.indexOf("キャンセル")>=0||
         st.indexOf("pending")>=0||st.indexOf("保留")>=0){ skipped++; continue; }
    }
    // 出荷状態の列がない形式でも、金額未確定（単価0で粗利マイナス）の行は除外
    if(num(rows[r][ci.unit])===0 && num(rows[r][ci.profit])<0){ skipped++; continue; }
    const m=String(raw).match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/); if(!m) continue;
    const ym=(+m[1])+"年"+(+m[2])+"月", day=+m[3];
    const jun=day<=10?"上旬":(day<=20?"中旬":"下旬");
    const qty=num(rows[r][ci.qty])||1;
    const o=byMonth[ym]=byMonth[ym]||{"上旬":{sales:0,profit:0,cnt:0},"中旬":{sales:0,profit:0,cnt:0},"下旬":{sales:0,profit:0,cnt:0}};
    o[jun].sales+=num(rows[r][ci.unit])*qty;
    o[jun].profit+=num(rows[r][ci.profit]);
    o[jun].cnt+=qty;
  }
  byMonth.__skipped=skipped;
  return byMonth;
}

/* プライスター在庫CSVの解析（editUploadProduct形式：number/price/cost。="…"形式や日本語列名にも対応） */
async function parseZaiko(file){
  const buf=await file.arrayBuffer();
  let text="";
  try{ text=new TextDecoder("shift_jis").decode(buf); }catch(e){}
  if(!/number|在庫/.test(text)){ text=new TextDecoder("utf-8").decode(buf); }
  const rows=parseCSV(text);
  if(rows.length<2) throw "データ行がありません";
  const head=rows[0].map(h=>String(h).trim().toLowerCase());
  const find=cands=>{ for(const c of cands){ const i=head.indexOf(c); if(i>=0) return i; }
    for(const c of cands){ const i=head.findIndex(h=>h.indexOf(c)>=0); if(i>=0) return i; } return -1; };
  const ci={stock:find(["number","在庫数","在庫"]),price:find(["price","出品価格","販売価格"]),cost:find(["cost","仕入れ価格","仕入価格","原価"])};
  if(ci.stock<0) throw "在庫数（number）の列が見つかりません。プライスターの「現在庫のダウンロード」のCSVを選んでください";
  const num=x=>{const v=parseFloat(String(x).replace(/^="?|"$/g,"").replace(/,/g,""));return isNaN(v)?0:v;};
  let cnt=0,sales=0,cost=0;
  for(let r=1;r<rows.length;r++){
    if(rows[r].length<=ci.stock) continue;
    const st=num(rows[r][ci.stock]); if(!st) continue;
    cnt+=st;
    if(ci.price>=0) sales+=num(rows[r][ci.price])*st;
    if(ci.cost>=0) cost+=num(rows[r][ci.cost])*st;
  }
  return {cnt:cnt, sales:Math.round(sales), cost:Math.round(cost),
          hasPrice:ci.price>=0, hasCost:ci.cost>=0};
}

  const editing=dokoEditId?DOKOALL.find(r=>r.id===dokoEditId):null;
  const today=new Date(); today.setHours(0,0,0,0);
  const rows=[...DOKOALL].sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const future=rows.filter(r=>{const d=new Date(r.date); return !isNaN(d)&&d>=today;});
  const past=rows.filter(r=>{const d=new Date(r.date); return isNaN(d)||d<today;}).reverse();
  const entryHtml=r=>{
    const route=parseRoute(r.route);
    const mine=String(r.uid)===String(me.sid);
    return `<div class="dcard">
      <div class="dcardh">
        <span class="ddate">${dokoDateLabel(r.date)}</span>
        <span class="dplace">${escH(r.place)}</span>
        ${route.length?`<button class="dtoggle" data-id="${r.id}">🗺 ルート表（${route.length}店舗）▼</button>`:""}
        <span style="flex:1"></span>
        ${mine?`<button class="dedit" data-id="${r.id}">編集</button>`:""}
        ${(mine||ADMIN_KEY)?`<button class="ddel" data-id="${r.id}">削除</button>`:""}
      </div>
      <div class="dmeta">👥 ${escH(r.members)||"—"}${r.memo?`　📝 ${escH(r.memo)}`:""}</div>
      ${route.length?`<div class="droutebox" data-route="${r.id}" style="display:none">${routeTableHtml(route)}</div>`:""}
    </div>`;
  };
  const listHtml=list=>list.length?list.map(entryHtml).join("")
    :'<div style="color:#c2c8d0;font-size:13px;padding:6px 2px">まだ登録がありません</div>';
  const editRoute=editing?parseRoute(editing.route):[];
  let html=`<div class="gpanel"><div class="gph">${editing?`✏️ 同行を編集（${dokoDateLabel(editing.date)} ${escH(editing.place)}）`:"🚗 同行を登録"} <span class="gpn">（同じエリアの人を誘ってどんどん組みましょう。エリアはメンバー情報タブで）</span></div>
    <div class="nrow3">
      <div><label class="glbl">日付</label><input class="ginput" type="date" id="d_date" value="${editing?escH(editing.date):""}"></div>
      <div><label class="glbl">場所・ルート名</label><input class="ginput" id="d_place" placeholder="例：吉祥寺〜世田谷 家電ルート" value="${editing?escH(editing.place):""}"></div>
      <div><label class="glbl">参加メンバー</label><input class="ginput" id="d_members" placeholder="例：藤田・北野（募集中もOK）" value="${editing?escH(editing.members):escH(me.name)}"></div>
    </div>
    <label class="glbl">メモ（任意）</label><input class="ginput" id="d_memo" placeholder="例：10時にドンキ◯◯店集合／あと1名募集" value="${editing?escH(editing.memo):""}">
    <label class="glbl" style="margin-top:10px">ルート表 <span class="gpn">（任意。◎=マスト ○=できれば △=時間があれば。終わった後に実際(分)・見込利益を入れると記録になります）</span></label>
    <div class="droutewrap"><div id="d_route">${(editRoute.length?editRoute:[]).map(drRowHtml).join("")}</div>
    <button type="button" class="tdadd" id="draddBtn">＋ 店舗を追加</button></div>
    <div style="margin-top:12px">
      <button class="gbtn" id="dsaveBtn">${editing?"更新する":"登録する"}</button>
      ${editing?`<button class="gbtn" id="dcancelBtn" style="background:#8a93a3">編集をやめる</button>`:""}
      <span class="gmsg" id="dmsg"></span></div>
  </div>
  <div class="gpanel"><div class="gph">これからの同行（${future.length}件）</div>${listHtml(future)}</div>
  <div class="gpanel"><div class="gph">過去の同行（${past.length}件）</div>${listHtml(past)}</div>`;
  body.innerHTML=html;

  document.querySelectorAll("#d_route .drrow").forEach(bindDrRow);
  document.getElementById("draddBtn").onclick=()=>{
    const box=document.getElementById("d_route");
    box.insertAdjacentHTML("beforeend",drRowHtml());
    bindDrRow(box.lastElementChild);
  };
  if(document.getElementById("dcancelBtn")){
    document.getElementById("dcancelBtn").onclick=()=>{ dokoEditId=null; renderDoko(); };
  }
  document.getElementById("dsaveBtn").onclick=async()=>{
    const btn=document.getElementById("dsaveBtn"), msg=document.getElementById("dmsg");
    const date=document.getElementById("d_date").value;
    const place=document.getElementById("d_place").value.trim();
    if(!date||!place){ msg.textContent="日付と場所を入れてください"; return; }
    btn.disabled=true; msg.textContent="保存中…";
    try{
      const payload={action:"dsave",pass:PASS,uid:me.sid,name:me.name,date:date,
        place:place,members:document.getElementById("d_members").value.trim(),
        memo:document.getElementById("d_memo").value.trim(),
        route:JSON.stringify(collectRoute())};
      if(dokoEditId) payload.id=dokoEditId;
      const d=await (await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},
        body:JSON.stringify(payload)})).json();
      if(d&&d.ok){ dokoEditId=null; DOKOALL=null; renderDoko(); return; }
      msg.textContent="保存に失敗しました："+(d&&d.error||"不明");
    }catch(e){ msg.textContent="通信エラー"; }
    btn.disabled=false;
  };
  body.querySelectorAll(".dtoggle").forEach(b=>{
    b.onclick=()=>{
      const el=body.querySelector(`div[data-route="${b.dataset.id}"]`);
      const open=el.style.display!=="none";
      el.style.display=open?"none":"";
      b.textContent=b.textContent.replace(open?"▲":"▼",open?"▼":"▲");
    };
  });
  body.querySelectorAll(".dedit").forEach(b=>{
    b.onclick=()=>{ dokoEditId=b.dataset.id; renderDoko(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
  body.querySelectorAll(".ddel").forEach(b=>{
    b.onclick=async()=>{
      if(!confirm("この同行予定を削除しますか？")) return;
      b.disabled=true;
      try{
        const d=await (await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},
          body:JSON.stringify({action:"ddel",pass:PASS,uid:me.sid,key:ADMIN_KEY||"",id:b.dataset.id})})).json();
        if(d&&d.ok){ dokoEditId=null; DOKOALL=null; renderDoko(); return; }
        alert(d&&d.error||"削除に失敗しました");
      }catch(e){ alert("通信エラー"); }
      b.disabled=false;
    };
  });
}

/* 未保存の入力値を退避（CSV取り込みなど同じ月内での再描画専用。月切り替えでは呼ばない） */
function captureNumsDraft(){
  if(!document.getElementById("n_gsales")) return;
  numsDraft={};
  NKEYS.forEach(k=>{ const el=document.getElementById("n_"+k); if(el) numsDraft[k]=el.value; });
  TODO_SECS.forEach(x=>{ const v=collectTodos(x[0]); if(v!==null) numsDraft[x[0]]=JSON.stringify(v); });
}

async function renderNums(){
  const body=document.getElementById("body");
  if(!me){ body.innerHTML='<div style="text-align:center;color:#6b7686;padding:40px">お名前を選ぶと数字報告を使えます</div>'; return; }
  if(!numsMonth) numsMonth=ymNow();
  if(NUMSALL===null){
    body.innerHTML='<div style="text-align:center;color:#6b7686;padding:40px">読み込み中…</div>';
    try{ NUMSALL=await jsonp({action:"nall"});}catch(e){ body.innerHTML='<div style="text-align:center;color:#6b7686;padding:40px">読み込みに失敗しました</div>'; NUMSALL=null; return; }
    if(chap!==NUMS) return;
  }
  if(GOALS===null){
    try{ const gd=await jsonp({action:"gall"}); GOALS={}; (gd.goals||[]).forEach(g=>{ (GOALS[g.uid]=GOALS[g.uid]||[]).push(g); }); }catch(e){ GOALS={}; }
    if(chap!==NUMS) return;
  }
  const meta=metaFor(me.sid,numsMonth)||{};
  const nm=numsFor(me.sid,numsMonth);
  const V=k=>escH((numsDraft&&numsDraft[k]!==undefined)?numsDraft[k]:(meta[k]||""));
  let html=`<div class="nbar"><button class="nnav" id="nprev0">◀</button><span class="nmonth">${numsMonth}</span><button class="nnav" id="nnext0">▶</button></div>`;

  html+=`<div class="gpanel"><div class="gph">① 今月の目標</div>
    <div class="nrow3">
      <div><label class="glbl">目標月商（円）</label><input class="ginput" id="n_gsales" inputmode="numeric" placeholder="5000000" value="${V("gsales")}"></div>
      <div><label class="glbl">目標粗利（円）</label><input class="ginput" id="n_gprofit" inputmode="numeric" placeholder="1000000" value="${V("gprofit")}"></div>
      <div><label class="glbl">その他経費（円）</label><input class="ginput" id="n_expense" inputmode="numeric" value="${(numsDraft&&numsDraft.expense!==undefined)?V("expense"):(meta.expense?V("expense"):"5390")}">
      <div class="nhint">未入力時は大口登録料5,390円のみ自動計上。正確にするならプライスター「売上分析」のその他経費の額を転記（FBA保管料・配送料金込み）</div></div>
    </div></div>`;

  const numv=x=>{const v=parseFloat(String(x||"").replace(/,/g,""));return isNaN(v)?0:v;};
  const gS0=numv(meta.gsales), gP0=numv(meta.gprofit);
  const srcOf=j=>numsParsed?numsParsed[j]:(nm[j]?{sales:nm[j].sales,profit:nm[j].profit,cnt:nm[j].cnt}:null);
  const pctTd=(v,goal)=>goal?`<td class="npct">${(v/goal*100).toFixed(1)}%</td>`:`<td class="npct" style="color:#c2c8d0">—</td>`;
  // 進捗率は「その旬までの累計 ÷ 月間目標」（上旬で33%・中旬で66%ペースなら月100%）
  // 終わっていない旬は数字が半端なので表示しない（旬の終了後に自動で出る）
  let cumS=0,cumP=0;
  const junRow=j=>{
    if(!junDone(numsMonth,j)) return `<tr><td>${j}</td><td colspan="5" style="color:#c2c8d0;text-align:left">${junWaitLabel(numsMonth,j)}</td></tr>`;
    const src=srcOf(j);
    if(!src) return `<tr><td>${j}</td><td colspan="5" style="color:#c2c8d0;text-align:left">未取込</td></tr>`;
    cumS+=src.sales; cumP+=src.profit;
    return `<tr><td>${j}</td><td>${yen(src.sales)}円</td>${pctTd(cumS,gS0)}<td>${yen(src.profit)}円</td>${pctTd(cumP,gP0)}<td>${yen(src.cnt)}個</td></tr>`;
  };
  const tots=JUNS.filter(j=>junDone(numsMonth,j)).reduce((a,j)=>{const x=srcOf(j);if(x){a.s+=x.sales;a.p+=x.profit;a.c+=x.cnt;a.any=true;}return a;},{s:0,p:0,c:0,any:false});
  const totalRow=tots.any?`<tr class="ntotal"><td>合計</td><td>${yen(tots.s)}円</td>${pctTd(tots.s,gS0)}<td>${yen(tots.p)}円</td>${pctTd(tots.p,gP0)}<td>${yen(tots.c)}個</td></tr>`:"";
  html+=`<div class="gpanel"><div class="gph">② プライスターCSVを取り込む <span class="gpn">（プライスター→注文一覧のCSVを選ぶと自動で旬別に集計）</span></div>
    <div class="ncsvrow"><button class="gbtn" id="ncsvBtn">CSVを選ぶ</button><span class="gmsg" id="ncsvMsg">${numsParsed?"取り込み済み（未保存）":""}</span></div>
    <table class="ntbl"><thead><tr><th></th><th>売上</th><th>累計進捗率</th><th>粗利</th><th>累計進捗率</th><th>個数</th></tr></thead><tbody>
      ${JUNS.map(junRow).join("")}${totalRow}
    </tbody></table>
    <div class="nhint">※表の粗利はその他経費の控除前。控除後の月間利益は「みんなの報告」の本文に反映されます</div>
    ${numsParsed?`<button class="gbtn" id="nnumSave" style="margin-top:10px">保存する</button>`:""}
  </div>`;

  const itemsOf=sec=>{
    const x=TODO_SECS.find(t=>t[0]===sec);
    if(numsDraft&&numsDraft[sec]!==undefined) return parseTodos(numsDraft[sec],"");
    return parseTodos(meta[sec],meta[x[2]]);
  };
  const junCard=(label,sec,gi,bi)=>`
    <div class="ncard">
      <div class="ncardh">${label}</div>
      <label class="glbl">todo <span class="gpn">達成したら☑・コメントに達成メモや未達の理由</span></label>
      ${todoListHtml(sec,itemsOf(sec))}
      <label class="glbl">良かったこと</label><textarea class="ginput" id="${gi}" rows="2">${V(gi.slice(2))}</textarea>
      <label class="glbl">反省点</label><textarea class="ginput" id="${bi}" rows="2">${V(bi.slice(2))}</textarea>
    </div>`;
  html+=`<div class="gpanel"><div class="gph">③ 行動目標・振り返り <span class="gpn">（書いた分だけ報告に載ります）</span></div>
    <div class="ncard nmonth-card">
      <div class="ncardh">月全体</div>
      <label class="glbl">todo <span class="gpn">達成したら☑・コメントに達成メモや未達の理由</span></label>
      ${todoListHtml("todo",itemsOf("todo"))}
    </div>
    <div class="nrow3 njun">
      ${junCard("上旬（1〜10日）","todo1","n_good1","n_bad1")}
      ${junCard("中旬（11〜20日）","todo2","n_good2","n_bad2")}
      ${junCard("下旬（21日〜末）","todo3","n_good3","n_bad3")}
    </div>
    <div class="ncsvrow" style="margin-top:14px"><button class="gbtn" id="nzaikoBtn">在庫CSVを取り込む</button><span class="gmsg" id="nzaikoMsg">FBAと自己発送の在庫CSVを2つまとめて選択（Ctrl/⌘＋クリック）→自動で合算</span></div>
    <div class="nrow3">
      <div><label class="glbl">在庫数（個・FBA＋自己発送）</label><input class="ginput" id="n_stockCnt" inputmode="numeric" value="${V("stockCnt")}"></div>
      <div><label class="glbl">在庫販売金額（円）</label><input class="ginput" id="n_stockSales" inputmode="numeric" value="${V("stockSales")}"></div>
      <div><label class="glbl">在庫仕入金額（円）</label><input class="ginput" id="n_stockCost" inputmode="numeric" value="${V("stockCost")}"></div>
    </div>
    <div style="margin-top:12px"><button class="gbtn" id="nmetaSave">保存する</button><span class="gpn" style="margin-left:8px">目標・数字・振り返りをまとめて保存します</span><span class="gmsg" id="nmetaMsg"></span></div>
  </div>`;

  let memHas=[...new Set(((NUMSALL&&NUMSALL.nums)||[]).filter(n=>n.ym===numsMonth).map(n=>String(n.uid))
    .concat(((NUMSALL&&NUMSALL.metas)||[]).filter(m=>m.ym===numsMonth).map(m=>String(m.uid))))];
  memHas=memHas.filter(u=>u!=="0"); // のの（マスタ）は報告しないので一覧に出さない
  // 自分を先頭に（データが無くても自分の行は常に出す。ののは除く）
  if(String(me.sid)!=="0") memHas=[String(me.sid)].concat(memHas.filter(u=>u!==String(me.sid)));
  const memName=u=>{const m=ROSTER.find(x=>String(x.sid)===u);return m?m.name:u;};
  html+=`<div class="gpanel"><div class="gph">みんなの報告（${numsMonth}）</div>`+
    memHas.map((u,i)=>
      `<div class="nmem"><div class="nmemh" data-uid="${u}">▶ ${escH(memName(u))}${u===String(me.sid)?'<span class="gpn">（自分の報告）</span>':""}</div><div class="nrbody" style="display:none" data-body="${u}"></div></div>`).join("")+`</div>`;

  body.innerHTML=html;

  body.querySelectorAll(".tdrow").forEach(bindTdRow);
  body.querySelectorAll(".tdadd").forEach(b=>{
    b.onclick=()=>{ b.insertAdjacentHTML("beforebegin",tdRowHtml()); bindTdRow(b.previousElementSibling); };
  });
  document.getElementById("nprev0").onclick=()=>{numsMonth=ymShift(numsMonth,-1);numsParsed=null;numsDraft=null;renderNums();};
  document.getElementById("nnext0").onclick=()=>{numsMonth=ymShift(numsMonth,1);numsParsed=null;numsDraft=null;renderNums();};

  document.getElementById("ncsvBtn").onclick=()=>{
    const inp=document.createElement("input"); inp.type="file"; inp.accept=".csv,text/csv";
    inp.onchange=async()=>{
      const f=inp.files[0]; if(!f) return;
      const msg=document.getElementById("ncsvMsg"); msg.textContent="解析中…";
      captureNumsDraft(); // 入力中の値が再描画で消えないように退避
      try{
        const byMonth=await parsePricetar(f);
        const skipped=byMonth.__skipped||0; delete byMonth.__skipped;
        const months=Object.keys(byMonth);
        let target=numsMonth;
        if(!byMonth[target]){
          if(months.length===1){ target=months[0]; numsMonth=target; numsDraft=null; }
          else{ msg.textContent=`選択中の${numsMonth}のデータがCSVにありません（含まれる月：${months.join("、")}）`; return; }
        }
        numsParsed=byMonth[target];
        await renderNums();
        if(skipped){ const m2=document.getElementById("ncsvMsg"); if(m2) m2.textContent=`取り込み済み（キャンセル・保留中の${skipped}件を除外）`; }
      }catch(e){ msg.textContent=String(e); }
    };
    inp.click();
  };

  /* 保存は1本化：目標・振り返り・（取り込み済みなら）CSVの数字をまとめて保存 */
  const saveAll=async(btn,msg)=>{
    const label=btn.textContent;
    btn.disabled=true; btn.textContent="保存中…"; if(msg) msg.textContent="";
    const g=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
    try{
      if(numsParsed){
        const rows=JUNS.map(j=>({jun:j,sales:Math.round(numsParsed[j].sales),profit:Math.round(numsParsed[j].profit),cnt:numsParsed[j].cnt}));
        const r1=await (await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},
          body:JSON.stringify({action:"nnum",pass:PASS,uid:me.sid,name:me.name,ym:numsMonth,rows:rows})})).json();
        if(!r1||!r1.ok) throw (r1&&r1.error)||"数字の保存に失敗";
      }
      const bodyData={action:"nsave",pass:PASS,uid:me.sid,name:me.name,ym:numsMonth,gradMonth:"",gradGoal:""};
      NKEYS.forEach(k=>{ bodyData[k]=g("n_"+k); });
      TODO_SECS.forEach(x=>{ bodyData[x[0]]=JSON.stringify(collectTodos(x[0])||[]); bodyData[x[2]]=""; });
      const r2=await (await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(bodyData)})).json();
      if(!r2||!r2.ok) throw (r2&&r2.error)||"入力内容の保存に失敗";
      NUMSALL=null; numsParsed=null; numsDraft=null;
      await renderNums();
      const m2=document.getElementById("nmetaMsg"); if(m2) m2.textContent="✅ 保存しました";
      return;
    }catch(e){
      if(msg) msg.textContent="保存に失敗しました："+String(e);
      else alert("保存に失敗しました："+String(e));
    }
    btn.disabled=false; btn.textContent=label;
  };

  const saveBtn=document.getElementById("nnumSave");
  if(saveBtn) saveBtn.onclick=()=>saveAll(saveBtn,document.getElementById("ncsvMsg"));

  document.getElementById("nzaikoBtn").onclick=()=>{
    const inp=document.createElement("input"); inp.type="file"; inp.accept=".csv,text/csv"; inp.multiple=true;
    inp.onchange=async()=>{
      const files=[...inp.files]; if(!files.length) return;
      const msg=document.getElementById("nzaikoMsg"); msg.textContent="解析中…";
      try{
        let cnt=0,sales=0,cost=0,hasPrice=false,hasCost=false;
        for(const f of files){
          const z=await parseZaiko(f);
          cnt+=z.cnt; sales+=z.sales; cost+=z.cost;
          hasPrice=hasPrice||z.hasPrice; hasCost=hasCost||z.hasCost;
        }
        document.getElementById("n_stockCnt").value=cnt;
        if(hasPrice) document.getElementById("n_stockSales").value=sales;
        if(hasCost) document.getElementById("n_stockCost").value=cost;
        msg.textContent=`✅ ${files.length}ファイル合算：在庫${yen(cnt)}個`+(hasPrice?` / 販売額${yen(sales)}円`:"")+(hasCost?` / 仕入額${yen(cost)}円`:"")+"（下の保存ボタンで確定）";
      }catch(e){ msg.textContent=String(e); }
    };
    inp.click();
  };
  const metaBtn=document.getElementById("nmetaSave");
  metaBtn.onclick=()=>saveAll(metaBtn,document.getElementById("nmetaMsg"));

  body.querySelectorAll(".nmemh").forEach(h=>{
    h.onclick=()=>{
      const el=body.querySelector(`div.nrbody[data-body="${h.dataset.uid}"]`);
      const open=el.style.display!=="none";
      el.style.display=open?"none":"";
      h.innerHTML=(open?"▶ ":"▼ ")+h.innerHTML.slice(2);
      if(!open) el.innerHTML=numsReportHtml(h.dataset.uid,numsMonth);
    };
  });
}

let GOALS=null, GOALS_LOADING=false, goalPanelOpen=null; // null=自動（未入力なら開く）
function loadGoals(){
  if(GOALS_LOADING) return; GOALS_LOADING=true;
  jsonp({action:"gall"}).then(d=>{
    GOALS={}; (d.goals||[]).forEach(g=>{ (GOALS[g.uid]=GOALS[g.uid]||[]).push(g); });
    if(chap===MEMBERS) renderMembers();
  }).catch(()=>{ GOALS={}; });
}
const escH=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function renderMembers(){
  const body=document.getElementById("body"); body.innerHTML="";
  if(!ROSTER.length){
    body.innerHTML='<div style="text-align:center;color:#6b7686;padding:40px">メンバー情報を読み込み中…</div>';
    return;
  }
  if(GOALS===null) loadGoals();
  // 生年月日未記入だと年齢がシート数式で126等になるため、ありえない値は非表示
  const ageOk=a=>{const n=parseInt(a,10);return(!isNaN(n)&&n>=10&&n<=100)?String(n):"";};

  const mine=myLog.length?myLog[myLog.length-1]:{num:"",after:""};

    const gOpen = goalPanelOpen!==null ? goalPanelOpen : !(mine.num||mine.after);
    html+=`<div class="gpanel"><div class="gph gtoggle" id="gphToggle"><span class="caret">${gOpen?"▼":"▶"}</span> 🎯 あなたの目標を入力 <span class="gpn">（メンバー全員に表示・月ごとにログが残ります）</span></div>
      <div id="gbody" style="${gOpen?"":"display:none"}">
      <label class="glbl">卒業までに達成したい数字</label>
      <input class="ginput" id="gnum" placeholder="例：月利50万円" value="${escH(mine.num)}">
      <label class="glbl">卒業した後にどんな事をやっていきたいか<span class="gpn">（今の段階で構いません／物販でも物販以外でも）</span></label>
      <textarea class="ginput" id="gafter" rows="2" placeholder="例：卸メーカー仕入れに挑戦しながら情報発信もやりたい">${escH(mine.after)}</textarea>
      <div><button class="gbtn" id="gsaveBtn">保存する</button><span class="gmsg" id="gmsg"></span></div>
      </div></div>`;
  }
  html+='<div class="apanel mpanel"><table><thead><tr>'+
    '<th>名前</th><th>エリア</th><th>年齢</th><th>誕生日</th><th>入会</th><th>専業/副業</th></tr></thead><tbody>';
  const sorted=[...ROSTER].sort((a,b)=>{
    const na=parseInt(a.sid,10), nb=parseInt(b.sid,10);
    if(isNaN(na)&&isNaN(nb))return 0;
    if(isNaN(na))return 1;
    if(isNaN(nb))return -1;
    return na-nb;
  });
  sorted.forEach((m,i)=>{
    const gcls=(m.gender||"").indexOf("男")>=0?"male":((m.gender||"").indexOf("女")>=0?"female":"");
    const isNono=m.sid==="0"||m.name.replace(/[\s　]+/g,"")==="野々脇雅史";
    const badge=isNono?'<span class="mbadge">マスタ</span>':(m.grad?'<span class="mbadge">卒業生・講師</span>':"");
    const glog=(GOALS&&GOALS[m.sid])||[];
    const hasDetail=!!(m.hobby||m.mbti||glog.length);
    html+=`<tr class="${gcls}${hasDetail?" mexp":""}" data-mi="${i}"><td class="pname">${m.name.replace(/^-/,"")}${badge}${hasDetail?'<span class="mmore">▸</span>':""}<div class="mkana">${m.kana||""}</div></td>`+
      `<td>${m.area||"—"}</td>`+
      `<td>${ageOk(m.age)||"—"}</td>`+
      `<td>${m.bday||"—"}</td>`+
      `<td>${fmtCohortJoinHtml(m)}</td>`+
      `<td>${m.work||"—"}</td></tr>`;
    if(hasDetail){
      html+=`<tr class="mdetail ${gcls}" data-md="${i}" style="display:none"><td colspan="6">`+
        (m.hobby?`<div><span class="mdl">趣味・特技</span>${escH(m.hobby)}</div>`:"")+
        (m.mbti?`<div><span class="mdl">タイプ別診断</span>${escH(m.mbti)}</div>`:"")+
        glog.slice().reverse().map(g=>
          `<div class="ghist"><span class="mdl">目標（${escH(g.ym)}）</span>`+
          (g.num?`<div class="gline">🎯 卒業までの数字：${escH(g.num)}</div>`:"")+
          (g.after?`<div class="gline">🚀 卒業後やりたい事：${escH(g.after)}</div>`:"")+
          `</div>`).join("")+
        `</td></tr>`;
    }
  });
  html+='</tbody></table></div>';
  body.innerHTML=html;
  const gt=document.getElementById("gphToggle");
  if(gt){
    gt.onclick=()=>{
      const gb=document.getElementById("gbody");
      const open=gb.style.display!=="none";
      goalPanelOpen=!open;
      gb.style.display=open?"none":"";
      gt.querySelector(".caret").textContent=open?"▶":"▼";
    };
  }
  const btn=document.getElementById("gsaveBtn");
  if(btn){
    btn.onclick=()=>{
      const num=document.getElementById("gnum").value.trim();
      const after=document.getElementById("gafter").value.trim();
      const msg=document.getElementById("gmsg");
      msg.textContent="保存中…";
      jsonp({action:"gsave",uid:me.sid,name:me.name,num:num,after:after}).then(d=>{
        if(d&&d.ok){
          if(!GOALS)GOALS={};
          const arr=GOALS[me.sid]=GOALS[me.sid]||[];
          const e=arr.find(x=>x.ym===d.ym);
          if(e){ e.num=num; e.after=after; } else arr.push({uid:me.sid,ym:d.ym,num:num,after:after});
          msg.textContent="✅ 保存しました（"+d.ym+"のログとして記録）";
          setTimeout(()=>{renderMembers();},900);
        }
        else msg.textContent="保存に失敗しました";
      }).catch(()=>{ msg.textContent="通信エラー"; });
    };
  }
  body.querySelectorAll("tr.mexp").forEach(tr=>{
    tr.style.cursor="pointer";
    tr.onclick=()=>{
      const d=body.querySelector(`tr.mdetail[data-md="${tr.dataset.mi}"]`);
      const open=d.style.display!=="none";
      d.style.display=open?"none":"";
      const car=tr.querySelector(".mmore"); if(car)car.textContent=open?"▸":"▾";
    };
  });
}

/* ---------- みんなの進捗（全員が見られる） ---------- */
async function renderEveryone(){
  const body=document.getElementById("body");
  body.innerHTML='<div style="text-align:center;color:#6b7686;padding:40px">読み込み中…</div>';
  try{
    await loadRoster();
    if(!pallCache){ const r=await jsonp({action:"pall"}); if(r&&r.error) throw r.error; pallCache=r; }
  }catch(e){ body.innerHTML='<div style="text-align:center;color:#6b7686;padding:40px">読み込みに失敗しました</div>'; return; }
  if(chap!==PALL) return;
  const prog={}, last={};
  (pallCache.rows||[]).forEach(r=>{
    if(!prog[r.uid])prog[r.uid]={};
    prog[r.uid][r.step]=r.checked;
    if(r.checked&&r.updated){const t=new Date(r.updated); if(!last[r.uid]||t>last[r.uid])last[r.uid]=t;}
  });
  const isStd=st=>st.cohort&&st.cohort.indexOf("WS")===0&&st.cohort.indexOf("FS")<0;
  const roster=ROSTER.filter(st=>!st.grad&&st.name.replace(/[\s　]+/g,"")!=="野々脇雅史")
    .slice().sort((a,b)=>{
      const na=parseInt(a.sid,10),nb=parseInt(b.sid,10);
      if(isNaN(na)&&isNaN(nb))return 0;
      if(isNaN(na))return 1;
      if(isNaN(nb))return -1;
      return na-nb;
    });
  let html='<button class="abtn" id="preload">🔄 最新に更新</button>'+
    '<div class="apanel mpanel"><table><thead><tr><th>受講生</th><th>入会</th>'+
    A_CHAPTERS.map(c=>`<th>${c.ch}</th>`).join("")+
    '<th>進捗</th><th>最終更新</th></tr></thead><tbody>';
  roster.forEach(st=>{
    const p=prog[st.sid]||{};
    const std=isStd(st);
    const per=A_CHAPTERS.map(c=>{
      if(std&&c.ch==="卸メーカー")return null;
      return {done:c.steps.filter(([id])=>p[id]).length,total:c.steps.length};
    });
    const done=per.reduce((a,x)=>a+(x?x.done:0),0);
    const total=per.reduce((a,x)=>a+(x?x.total:0),0);
    const pct=total?Math.round(done/total*100):0;
    const lu=last[st.sid];
    html+=`<tr><td class="pname"><span style="color:#9aa3af;font-weight:400;margin-right:6px">${isNaN(parseInt(st.sid,10))?"":st.sid}</span>${st.name.replace(/^-/,"")}</td>`+
      `<td>${fmtCohortJoinHtml(st)}</td>`+
      per.map(x=>x?`<td>${x.done}/${x.total}</td>`:`<td style="color:#c2c8d0">—</td>`).join("")+
      `<td><span class="abar"><i style="width:${pct}%"></i></span><span class="apct">${pct}%</span></td>`+
      `<td>${lu?`${lu.getMonth()+1}/${lu.getDate()}`:"—"}</td></tr>`;
  });
  html+='</tbody></table></div><div class="ahint">みんなで進捗を見せ合って、切磋琢磨しましょう💪</div>';
  body.innerHTML=html;
  document.getElementById("preload").onclick=()=>{pallCache=null;renderEveryone();};
}

/* ---------- 管理：ステップ別の完了状況 ---------- */
function renderStepView(){
  const box=document.getElementById("stepResult");
  if(!box||!adminCache) return;
  if(!adminStepSel){ box.textContent="ステップを選ぶと、完了した人／未完了の人が表示されます"; return; }
  // 対象ステップの章を特定（STは卸・メーカー章を対象外に）
  let stepCh="";
  A_CHAPTERS.forEach(c=>{ if(c.steps.some(([id])=>id===adminStepSel)) stepCh=c.ch; });
  const prog={};
  (adminCache.rows||[]).forEach(r=>{ if(!prog[r.uid])prog[r.uid]={}; prog[r.uid][r.step]=r.checked; });
  const isStd=st=>st.cohort&&st.cohort.indexOf("WS")===0&&st.cohort.indexOf("FS")<0;
  let roster=(adminCache.roster||[]).filter(st=>!st.grad && st.name.replace(/[\s　]+/g,"")!=="野々脇雅史");
  if(stepCh==="卸メーカー") roster=roster.filter(st=>!isStd(st));
  const done=roster.filter(st=>prog[st.sid]&&prog[st.sid][adminStepSel]);
  const notyet=roster.filter(st=>!(prog[st.sid]&&prog[st.sid][adminStepSel]));
  const chip=(st,cls)=>`<span class="schip ${cls}">${st.name.replace(/^-/,"")}</span>`;
  box.innerHTML=
    `<div style="margin-bottom:8px"><b style="color:var(--done)">✅ 完了 ${done.length}名</b><br>${done.map(st=>chip(st,"done")).join("")||'<span style="color:#9aa3af">なし</span>'}</div>`+
    `<div><b style="color:#dc2626">⬜ 未完了 ${notyet.length}名</b><br>${notyet.map(st=>chip(st,"notyet")).join("")||'<span style="color:#9aa3af">なし</span>'}</div>`;
}

/* ---------- 管理：全員×ブランドの解除マトリクス ---------- */
async function renderKaijoMatrix(){
  const box=document.getElementById("kmatrixBox");
  if(!box) return;
  box.innerHTML='<div style="color:#6b7686;padding:14px">読み込み中…</div>';
  let all;
  try{
    if(!BRANDS){ const r=await jsonp({action:"kbrands"}); if(r&&r.error) throw r.error; BRANDS=r.brands||[]; }
    all=await jsonp({action:"kall", key:ADMIN_KEY});
    if(all&&all.error) throw all.error;
  }catch(e){ box.innerHTML='<div style="color:#dc2626;padding:14px">読み込み失敗</div>'; return; }
  const map={}; // uid -> {brand: status}
  (all.rows||[]).forEach(r=>{ if(!map[r.uid])map[r.uid]={}; map[r.uid][r.brand]=r.status; });
  const roster=(adminCache&&adminCache.roster||[]).filter(st=>!st.grad && st.name.replace(/[\s　]+/g,"")!=="野々脇雅史");
  const short=v=>{
    if(!v||v==="未確認")return "";
    if(v==="制限なし")return "なし";
    if(v==="要承認")return "要承";
    return v.replace("解除","");
  };
  const color=v=>{
    if(!v||v==="未確認")return "#c2c8d0";
    if(v==="制限なし")return "#0e9f6e";
    if(v==="要承認")return "#d97706";
    return "#2563eb";
  };
  let html='<div class="apanel" style="margin-top:10px;max-height:70vh"><table><thead><tr><th>受講生</th>';
  BRANDS.forEach(b=>{ html+=`<th title="${b.pri}">${b.brand}</th>`; });
  html+='</tr></thead><tbody>';
  roster.forEach(s=>{
    const m=map[s.sid]||{};
    html+=`<tr><td class="pname">${s.name.replace(/^-/,"")}</td>`;
    BRANDS.forEach(b=>{
      const v=m[b.brand]||"";
      html+=`<td style="color:${color(v)};font-weight:700;font-size:12px" title="${b.brand}: ${v||"未確認"}">${short(v)}</td>`;
    });
    html+='</tr>';
  });
  html+='</tbody></table></div><div class="ahint">緑=制限なし／オレンジ=要承認／青=解除済み（解除先）／空欄=未確認</div>';
  box.innerHTML=html;
}

/* ---------- ブランド別 解除状況（制限解除タブ内） ---------- */
function kselColor(sel){
  const v=sel.value;
  let bg="#eef1f5", fg="#6b7686";
  if(v==="制限なし"){bg="#eafaf2";fg="#0e9f6e";}
  else if(v==="要承認"){bg="#fef3e2";fg="#d97706";}
  else if(v.indexOf("申請中")>=0){bg="#f4effd";fg="#7c3aed";}
  else if(v.indexOf("解除")>=0){bg="#eaf1ff";fg="#2563eb";}
  sel.style.background=bg; sel.style.color=fg; sel.style.fontWeight="700";
}

  const sec=document.createElement("div"); sec.className="group";

async function fillKaijo(){
  const box=document.getElementById("kaijoBox");
  if(!box) return;
  if(!me){ box.textContent="お名前を選ぶと、自分の解除状況を記録できます"; return; }
  try{
    if(!BRANDS){ const r=await jsonp({action:"kbrands"}); if(r&&r.error) throw r.error; BRANDS=r.brands||[]; }
    if(!kaijoLoaded){ const r2=await jsonp({action:"kget", uid:me.sid}); if(r2&&!r2.error){ kaijoState=r2.status||{}; kaijoPdf=r2.pdf||{}; kaijoLoaded=true; } }
    if(ALLKAIJO===null){ const r3=await jsonp({action:"kpall"}); ALLKAIJO=(r3&&r3.rows)||[]; }
  }catch(e){ box.textContent="読み込みに失敗しました。通信環境を確認してください"; return; }
  const cnt=document.getElementById("kaijoCnt");
  if(cnt){ const done=Object.values(kaijoState).filter(v=>v&&v!=="未確認").length; cnt.textContent=`確認済み ${done}/${BRANDS.length}`; }
  const stMap={};
  (ALLKAIJO||[]).forEach(r=>{ (stMap[String(r.uid)]=stMap[String(r.uid)]||{})[r.brand]=r; });
  const chipCls=st=>st==="制限なし"?"kc-ok":(st==="要承認"?"kc-warn":(String(st).indexOf("申請中")>=0?"kc-pend":(String(st).indexOf("解除")>=0?"kc-blue":"")));
  // 列＝自分以外のメンバー（番号順）。ヘッダーは苗字（被りは名前1文字を追加）
  const mems=[...ROSTER].filter(m=>String(m.sid)!==String(me.sid)).sort((a,b)=>{
    const na=parseInt(a.sid,10), nb=parseInt(b.sid,10);
    if(isNaN(na)&&isNaN(nb))return 0; if(isNaN(na))return 1; if(isNaN(nb))return -1; return na-nb;
  });
  const sei=n=>String(n||"").trim().split(/[\s　]+/)[0];
  const seiCount={};
  mems.forEach(m=>{ seiCount[sei(m.name)]=(seiCount[sei(m.name)]||0)+1; });
  const memLabel=m=>{
    const s0=sei(m.name);
    if(seiCount[s0]<=1) return s0;
    const mei=String(m.name||"").trim().split(/[\s　]+/)[1]||"";
    return s0+mei.slice(0,1);
  };
  let html='<div class="apanel mpanel kpanel"><table><thead><tr><th>優先度</th><th>ブランド</th><th>状態</th>'
    +mems.map(m=>`<th class="kmem">${memLabel(m)}</th>`).join("")+'</tr></thead><tbody>';
  BRANDS.forEach(b=>{
    const st=kaijoState[b.brand]||"未確認";
    const opts=KSTATUS.map(o=>`<option ${o===st?"selected":""}>${o}</option>`).join("");
    const brandEsc=b.brand.replace(/"/g,"&quot;");
    const asin=b.asin?` <a href="https://www.amazon.co.jp/dp/${encodeURIComponent(b.asin)}" target="_blank" rel="noopener" style="font-size:11px;color:#2563eb;text-decoration:none">確認↗</a>`+
      `<div class="kasin"><span>${b.asin}</span><button class="kcopy" data-asin="${b.asin}" title="ASINをコピー">コピー</button></div>`:"";
    const myPdf=kaijoPdf[b.brand]?` <a class="kpdflink" href="${kaijoPdf[b.brand]}" target="_blank" rel="noopener">📄</a>`:"";
    const cells=mems.map(m=>{
      const r=stMap[String(m.sid)]&&stMap[String(m.sid)][b.brand];
      const stx=r&&r.status&&r.status!=="未確認"?r.status:"";
      const pdf=r&&r.pdf?` <a href="${r.pdf}" target="_blank" rel="noopener" title="解除PDFを見る">📄</a>`:"";
      return `<td class="kcell ${stx?chipCls(stx):""}" title="${memLabel(m)}：${stx||"未確認"}">${stx}${pdf}</td>`;
    }).join("");
    html+=`<tr><td style="font-size:12px;color:#6b7686">${b.pri}</td>`+
      `<td class="pname">${b.brand}${asin}</td>`+
      `<td><select class="ksel" data-brand="${brandEsc}" style="padding:6px 10px;border:1px solid #e3e6ea;border-radius:8px;font-size:12.5px">${opts}</select>`+
      `<div class="kpdfrow">${myPdf}<button class="kup" data-brand="${brandEsc}">＋PDF</button></div></td>`+
      cells+`</tr>`;
  });
  html+='</tbody></table></div>';
  box.innerHTML=html;
  box.querySelectorAll(".kup").forEach(btn=>{
    btn.onclick=()=>{
      const brand=btn.dataset.brand;
      const inp=document.createElement("input");
      inp.type="file"; inp.accept="application/pdf,.pdf";
      inp.onchange=()=>{
        const f=inp.files[0];
        if(!f) return;
        if(f.size>10*1024*1024){ alert("10MB以下のPDFにしてください"); return; }
        btn.textContent="アップロード中…"; btn.disabled=true;
        const fr=new FileReader();
        fr.onload=async()=>{
          const b64=String(fr.result).split(",")[1];
          try{
            const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},
              body:JSON.stringify({action:"kpdf",pass:PASS,uid:me.sid,name:me.name,brand:brand,filename:f.name,data:b64})});
            const d=await res.json();
            if(d&&d.ok){
              kaijoPdf[brand]=d.url;
              ALLKAIJO=null; // 次回表示時に再取得
              fillKaijo();
              return;
            }
            alert("アップロードに失敗しました："+(d&&d.error||"不明なエラー"));
          }catch(e){ alert("アップロードに失敗しました。通信環境を確認してください"); }
          btn.textContent="＋PDF添付"; btn.disabled=false;
        };
        fr.readAsDataURL(f);
      };
      inp.click();
    };
  });
  box.querySelectorAll(".kcopy").forEach(btn=>{
    btn.onclick=()=>{
      const asin=btn.dataset.asin;
      const ok=()=>{ btn.textContent="✅ コピー済"; setTimeout(()=>{btn.textContent="コピー";},1200); };
      const fallback=()=>{
        const ta=document.createElement("textarea"); ta.value=asin;
        ta.style.position="fixed"; ta.style.opacity="0";
        document.body.appendChild(ta); ta.select();
        try{ document.execCommand("copy"); ok(); }catch(e){ prompt("手動でコピーしてください", asin); }
        document.body.removeChild(ta);
      };
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(asin).then(ok).catch(fallback);
      } else fallback();
    };
  });
  box.querySelectorAll(".ksel").forEach(sel=>{
    kselColor(sel);
    sel.onchange=()=>{
      const brand=sel.dataset.brand, st=sel.value;
      kaijoState[brand]=st;
      kselColor(sel);
      const cnt2=document.getElementById("kaijoCnt");
      if(cnt2){ const done=Object.values(kaijoState).filter(v=>v&&v!=="未確認").length; cnt2.textContent=`確認済み ${done}/${BRANDS.length}`; }
      jsonp({action:"ksave", uid:me.sid, name:me.name, brand:brand, status:st}).catch(()=>{});
    };
  });
}

    renderNums();
    return;
  }
  if(chap===DOKO){
    pc.style.display="none";
    renderDoko();
    return;

    .map((t,i)=>`<button class="lvbtn ${lvFilter===i?"on":""}" data-lv="${i}">${t}</button>`).join("")
    +`<button class="lvbtn hotbtn ${lvFilter==="hot"?"on":""}" data-lv="hot">🔴 最優先</button>`;

  fb.querySelectorAll(".lvbtn").forEach(b=>b.onclick=()=>{lvFilter=b.dataset.lv==="hot"?"hot":+b.dataset.lv;render();});

      if(a) a.onclick=e=>e.stopPropagation(); // リンククリックではチェックを切り替えない

    });
    if(g.g){
      const key=c.ch+"|"+g.g;
      const open = key in openG ? openG[key] : gi===firstOpen;
      const gh=document.createElement("div");
      gh.className="gh acc";
      gh.innerHTML=`<span class="caret">${open?"▼":"▶"}</span>${g.g}<span class="gc">${gdone}/${gt}</span>`;
      gh.onclick=()=>{openG[key]=!open;render();};
      gd.appendChild(gh);
      if(!open) ul.style.display="none";
    }
    gd.appendChild(ul); body.appendChild(gd);
  });
  const {t,d}=chapStats(chap);
  const pct=t?Math.round(d/t*100):0;
  document.getElementById("pctText").textContent=pct+"%";
  document.getElementById("countText").textContent=`${d} / ${t} 完了`;
  document.getElementById("chapName").textContent=`「${c.ch}」章`;
  document.getElementById("ringFg").style.strokeDashoffset=144.5*(1-pct/100);
}

document.getElementById("vreload").onclick=e=>{
  e.preventDefault();
  location.replace(location.pathname+"?v="+Date.now()+location.hash); // キャッシュを避けて読み直す
};

if(location.hash==="#admin" && ADMIN_KEY) chap=ADMIN; // 管理者はそのまま管理タブへ
